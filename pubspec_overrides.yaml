# Local dependency overrides for platform-specific fixes.
#
# IMPORTANT: pubspec_overrides.yaml replaces the root dependency_overrides
# section rather than merging it, so keep the existing project overrides here
# as well.
#
# The temporary flutter_inappwebview WebAuthn fork override was removed because
# PR #2743 is based on an older platform_interface API and is incompatible with
# the hosted flutter_inappwebview 6.2.0-beta.3 used by this project. The app does
# not currently reference the fork-only WebAuthenticationSupport API.
dependency_overrides:
  device_info_plus: 12.3.0

  flutter_inappwebview_linux:
    path: packages/flutter_inappwebview_linux

  flutter_inappwebview_windows:
    path: packages/flutter_inappwebview_windows

  flutter_rust_bridge: 2.12.0
