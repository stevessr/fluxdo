# Temporary overrides for native WebAuthn support in flutter_inappwebview.
#
# flutter_inappwebview 6.2.0-beta.3 does not yet expose
# WebSettingsCompat.setWebAuthenticationSupport on Android. Pin the reviewed
# upstream PR #2743 commit until the feature is released upstream.
#
# IMPORTANT: pubspec_overrides.yaml replaces the root dependency_overrides
# section rather than merging it, so keep the existing project overrides here
# as well.
dependency_overrides:
  device_info_plus: 12.3.0

  flutter_inappwebview_android:
    git:
      url: https://github.com/susemeee/flutter_inappwebview.git
      ref: e5090e6b17cf73417c8e7d29f00241c3af129eb7
      path: flutter_inappwebview_android

  flutter_inappwebview_platform_interface:
    git:
      url: https://github.com/susemeee/flutter_inappwebview.git
      ref: e5090e6b17cf73417c8e7d29f00241c3af129eb7
      path: flutter_inappwebview_platform_interface

  flutter_inappwebview_linux:
    path: packages/flutter_inappwebview_linux

  flutter_inappwebview_windows:
    path: packages/flutter_inappwebview_windows

  flutter_rust_bridge: 2.12.0
