name: Apply Matrix edit and redaction support

on:
  push:
    branches:
      - feat/experimental-matrix-telegram
    paths:
      - '.github/workflows/experimental-matrix-mutations-apply.yaml'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/experimental-matrix-telegram
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Apply Matrix mutation patch
        run: python3 tool/experimental_matrix_mutations.py

      - name: Format mutation surface
        run: >-
          dart format
          lib/pages/chat/matrix_room_page.dart
          lib/pages/chat/matrix_thread_page.dart
          lib/services/matrix_client_service.dart
          lib/services/messaging/matrix_message_content.dart
          lib/services/messaging/messaging_provider.dart
          lib/services/messaging/matrix_messaging_provider.dart
          test/pages/chat/matrix_room_page_test.dart
          test/pages/chat/matrix_thread_page_test.dart
          test/services/messaging/matrix_message_content_test.dart
          test/services/messaging/matrix_messaging_provider_test.dart

      - name: Prepare generated test sources
        run: dart tool/project_prep.dart test

      - name: Run focused mutation tests
        run: >-
          flutter test
          test/pages/chat/matrix_room_page_test.dart
          test/pages/chat/matrix_thread_page_test.dart
          test/services/messaging/matrix_message_content_test.dart
          test/services/messaging/matrix_messaging_provider_test.dart
          --no-pub

      - name: Validate patch shape
        run: git diff --check

      - name: Commit Matrix mutations
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/pages/chat/matrix_room_page.dart \
            lib/pages/chat/matrix_thread_page.dart \
            lib/services/matrix_client_service.dart \
            lib/services/messaging/matrix_message_content.dart \
            lib/services/messaging/messaging_provider.dart \
            lib/services/messaging/matrix_messaging_provider.dart \
            test/pages/chat/matrix_room_page_test.dart \
            test/pages/chat/matrix_thread_page_test.dart \
            test/services/messaging/matrix_message_content_test.dart \
            test/services/messaging/matrix_messaging_provider_test.dart
          git commit -m 'feat(matrix): add edit and redaction actions'
          git push origin HEAD:feat/experimental-matrix-telegram
