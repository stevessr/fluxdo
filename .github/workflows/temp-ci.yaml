name: Temporary CI

on:
  push:
    branches:
      - feat/discourse-parity-wave1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  format-community-preferences:
    name: apply-targeted-dart-format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/discourse-parity-wave1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Apply Dart formatter to parity preference files
        run: |
          set -euo pipefail
          files=(
            lib/models/community_user_preferences.dart
            lib/pages/community_account_settings_page.dart
            lib/services/discourse/_parity.dart
            test/models/community_user_preferences_test.dart
          )
          dart format "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            echo "Target files are already formatted."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${files[@]}"
          git commit -m "style: format native community preferences"
          git push origin HEAD:feat/discourse-parity-wave1
