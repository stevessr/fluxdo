name: Chat Activity Regression

on:
  pull_request:
    paths:
      - 'lib/models/chat/**'
      - 'lib/providers/chat_providers.dart'
      - 'lib/pages/chat/**'
      - 'lib/widgets/chat/**'
      - 'lib/widgets/common/emoji_text.dart'
      - 'lib/widgets/common/styled_emoji_image.dart'
      - 'test/pages/chat/**'
      - '.github/workflows/chat-activity-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - name: Prepare assets
        run: mkdir -p assets/certs
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Generate localizations
        run: dart run tool/gen_l10n.dart
      - name: Analyze chat changes
        run: |
          flutter analyze --no-fatal-infos \
            lib/models/chat/chat_channel.dart \
            lib/models/chat/chat_thread.dart \
            lib/providers/chat_providers.dart \
            lib/pages/chat/chat_page.dart \
            lib/pages/chat/chat_message_page.dart \
            lib/pages/chat/chat_thread_list_sheet.dart \
            lib/pages/chat/chat_thread_sheet.dart \
            lib/widgets/chat/chat_thread_preview_card.dart \
            test/pages/chat/chat_thread_activity_test.dart
      - name: Run chat regression tests
        run: dart tool/flutterw.dart test test/pages/chat/chat_thread_activity_test.dart test/pages/chat_message_bubble_layout_test.dart test/pages/chat_conversation_tabs_test.dart
