name: Site Information Parity

on:
  pull_request:
    paths:
      - 'lib/models/site_about.dart'
      - 'lib/models/site_policy_document.dart'
      - 'lib/navigation/nav_entry_registry.dart'
      - 'lib/pages/site_about_page.dart'
      - 'lib/pages/site_policy_page.dart'
      - 'lib/widgets/common/site_info_tabs.dart'
      - 'test/models/site_about_test.dart'
      - 'test/models/site_policy_document_test.dart'
      - '.github/workflows/site-information-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-information-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Prepare asset directories
        run: mkdir -p assets/certs

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: dart run tool/gen_l10n.dart

      - name: Analyze site information integration
        run: >-
          flutter analyze --no-fatal-infos --no-fatal-warnings
          lib/models/site_about.dart
          lib/models/site_policy_document.dart
          lib/navigation/nav_entry_registry.dart
          lib/pages/site_about_page.dart
          lib/pages/site_policy_page.dart
          lib/widgets/common/site_info_tabs.dart
          test/models/site_about_test.dart
          test/models/site_policy_document_test.dart

      - name: Test site information and policy parsing
        run: >-
          flutter test
          test/models/site_about_test.dart
          test/models/site_policy_document_test.dart
