name: Apply Matrix stability hardening

on:
  push:
    branches:
      - feat/experimental-matrix-telegram
    paths:
      - '.github/workflows/experimental-matrix-stability-apply.yaml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/experimental-matrix-telegram
          fetch-depth: 0

      - name: Apply owned transport lifecycle cleanup
        run: python3 tool/experimental_matrix_transport_lifecycle.py

      - name: Harden streamed temporary attachment files
        run: python3 tool/experimental_matrix_temp_file_hardening.py

      - name: Cache Matrix media configuration briefly
        run: python3 tool/experimental_matrix_media_config_cache.py

      - name: Validate patch shape
        run: |
          git diff --check
          git diff -- \
            lib/pages/chat/matrix_chat_page.dart \
            lib/services/matrix_client_service.dart \
            lib/services/messaging/matrix_homeserver_discovery.dart \
            lib/services/messaging/matrix_sso_service.dart \
            lib/services/messaging/matrix_media_service.dart \
            lib/services/messaging/matrix_media_temp_file_io.dart

      - name: Commit stability hardening
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/pages/chat/matrix_chat_page.dart \
            lib/services/matrix_client_service.dart \
            lib/services/messaging/matrix_homeserver_discovery.dart \
            lib/services/messaging/matrix_sso_service.dart \
            lib/services/messaging/matrix_media_service.dart \
            lib/services/messaging/matrix_media_temp_file_io.dart
          git commit -m 'perf(matrix): close owned transports and harden media IO'
          git push origin HEAD:feat/experimental-matrix-telegram
