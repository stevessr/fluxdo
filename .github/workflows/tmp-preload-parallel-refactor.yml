name: Apply parallel preload hydration

on:
  push:
    branches:
      - perf/preload-parallel-hydration
    paths:
      - '.github/workflows/tmp-preload-parallel-refactor.yml'
      - 'tool/tmp_preload_parallel_refactor.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: perf/preload-parallel-hydration
          submodules: recursive
          fetch-depth: 0

      - name: Apply parallel preload refactor
        run: python3 tool/tmp_preload_parallel_refactor.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Prepare generated asset directories
        run: mkdir -p assets/certs

      - name: Install dependencies
        run: flutter pub get

      - name: Format touched Dart files
        run: >-
          dart format
          lib/services/preloaded_data_service.dart
          lib/services/preloaded_data_decoder.dart
          test/services/preloaded_data_decoder_test.dart

      - name: Analyze parallel preload path
        run: >-
          flutter analyze
          lib/services/preloaded_data_service.dart
          lib/services/preloaded_data_decoder.dart
          test/services/preloaded_data_decoder_test.dart

      - name: Run preload decoder tests
        run: >-
          dart tool/flutterw.dart test
          test/services/preloaded_data_decoder_test.dart

      - name: Commit verified refactor and remove one-shot helpers
        shell: bash
        run: |
          rm .github/workflows/tmp-preload-parallel-refactor.yml
          rm tool/tmp_preload_parallel_refactor.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/preloaded_data_service.dart \
                  lib/services/preloaded_data_decoder.dart \
                  test/services/preloaded_data_decoder_test.dart \
                  .github/workflows/tmp-preload-parallel-refactor.yml \
                  tool/tmp_preload_parallel_refactor.py
          git commit -m 'perf(preload): parallelize preload hydration workers'
          git push origin HEAD:perf/preload-parallel-hydration
