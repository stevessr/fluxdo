name: Temporary upstream hunk replay

on:
  push:
    branches:
      - sync/upstream-20260905

permissions:
  contents: write

jobs:
  replay-upstream-hunks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Replay clean upstream hunks on preserved conflict files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Lingyan000/fluxdo.git
          git fetch upstream main
          base="4bc67227573a41c0119584acecd6e33ad0c3f746"

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            [ "$path" != "packages/fluxdo_render" ] || continue
            if ! git cat-file -e "$base:$path" 2>/dev/null; then
              echo "skip add/add candidate: $path"
              continue
            fi
            patch_file=$(mktemp)
            git diff --binary "$base" upstream/main -- "$path" > "$patch_file"
            if [ ! -s "$patch_file" ]; then
              rm -f "$patch_file"
              continue
            fi
            set +e
            git apply --reject --whitespace=nowarn "$patch_file"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "rejected hunks remain for: $path"
            fi
            rm -f "$patch_file"
          done < UPSTREAM_SYNC_CONFLICTS.txt

          rm -f .github/workflows/temp-upstream-hunks.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No replay changes"
            exit 0
          fi
          git commit -m "sync: replay clean upstream hunks on conflicted files"
          git push origin HEAD:sync/upstream-20260905
