name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - "lib/**"
      - "android/**"
      - "rust/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "lib/**"
      - "android/**"
      - "rust/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: bash
        run: |
          echo 'matrix={"include":[{"target":"arm64-v8a","rust_target":"aarch64-linux-android"}]}' >> "$GITHUB_OUTPUT"

  build-apk:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    name: build-apk (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: "3.35.2"
      JAVA_VERSION: "17"
      ANDROID_NDK_VERSION: "27.0.12077973"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cargo-ndk
        uses: taiki-e/install-action@cargo-ndk

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        shell: bash
        run: sdkmanager "ndk;${ANDROID_NDK_VERSION}"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Fetch dependencies
        run: flutter pub get

      - name: Build Rust library
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
          export NDK_HOME="$ANDROID_NDK_HOME"
          cargo ndk \
            --target ${{ matrix.target }} \
            --platform 24 \
            --output-dir android/app/src/main/jniLibs \
            build --release --manifest-path rust/Cargo.toml

      - name: Build Android APK
        shell: bash
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fluxdo-${{ matrix.target }}-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
