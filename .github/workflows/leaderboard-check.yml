name: Leaderboard Discourse Parity

on:
  pull_request:
    paths:
      - 'lib/pages/leaderboard_page.dart'
      - 'lib/utils/leaderboard_period_range.dart'
      - 'packages/app_icons/lib/src/app_icons.dart'
      - 'test/pages/leaderboard_period_range_test.dart'
      - '.github/workflows/leaderboard-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaderboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Prepare generated asset directories
        run: mkdir -p assets/certs

      - name: Install dependencies
        run: flutter pub get

      - name: Generate translations
        run: dart run tool/gen_l10n.dart

      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/pages/leaderboard_page.dart \
            lib/utils/leaderboard_period_range.dart \
            test/pages/leaderboard_period_range_test.dart
          git diff --check

      - name: Analyze leaderboard integration
        run: >-
          flutter analyze
          lib/pages/leaderboard_page.dart
          lib/utils/leaderboard_period_range.dart
          test/pages/leaderboard_period_range_test.dart

      - name: Test period boundaries
        run: flutter test test/pages/leaderboard_period_range_test.dart
