name: Cakeday UI PR Check

on:
  pull_request:
    paths:
      - 'lib/pages/community_events_page.dart'
      - 'lib/navigation/nav_entry_registry.dart'
      - 'lib/providers/preferences_provider.dart'
      - 'lib/utils/discourse_url_parser.dart'
      - 'lib/utils/link_launcher.dart'
      - 'test/pages/community_events_page_test.dart'
      - 'test/utils/discourse_url_parser_test.dart'
      - '.github/workflows/cakeday-pr-check.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
      - 'packages/common_ui/**'
      - 'tool/gen_l10n.dart'
      - 'tool/flutterw.dart'
      - 'tool/project_prep.dart'
      - 'lib/l10n/**'
      - '.github/workflows/_check-scope.yml'
      - 'lib/pages/community_events_calendar.dart'
      - 'test/pages/community_events_calendar_test.dart'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cakeday-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    uses: ./.github/workflows/_check-scope.yml
    with:
      workflow_file: .github/workflows/cakeday-pr-check.yml
      patterns: >-
        ["lib/pages/community_events_page.dart","lib/navigation/nav_entry_registry.dart","lib/providers/preferences_provider.dart","lib/utils/discourse_url_parser.dart","lib/utils/link_launcher.dart","test/pages/community_events_page_test.dart","test/utils/discourse_url_parser_test.dart",".github/workflows/cakeday-pr-check.yml","pubspec.yaml","pubspec.lock",".fvmrc","packages/common_ui/**","tool/gen_l10n.dart","tool/flutterw.dart","tool/project_prep.dart","lib/l10n/**",".github/workflows/_check-scope.yml","lib/pages/community_events_calendar.dart","test/pages/community_events_calendar_test.dart"]

  verify:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - name: Install Flutter Linux native hook dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Prepare generated assets
        run: mkdir -p assets/certs

      - name: Resolve packages
        run: flutter pub get

      - name: Generate localization code
        run: dart run tool/gen_l10n.dart

      - name: Check changed Dart formatting
        run: |
          dart format \
            lib/pages/community_events_page.dart \
            lib/navigation/nav_entry_registry.dart \
            lib/utils/discourse_url_parser.dart \
            lib/utils/link_launcher.dart \
            test/pages/community_events_page_test.dart \
            test/utils/discourse_url_parser_test.dart
          git diff --exit-code -- lib/pages/community_events_page.dart lib/navigation/nav_entry_registry.dart lib/utils/discourse_url_parser.dart lib/utils/link_launcher.dart test/pages/community_events_page_test.dart test/utils/discourse_url_parser_test.dart

      - name: Analyze cakeday implementation
        run: >-
          flutter analyze --no-fatal-infos --no-fatal-warnings
          lib/pages/community_events_page.dart
          lib/navigation/nav_entry_registry.dart
          lib/providers/preferences_provider.dart
          lib/utils/discourse_url_parser.dart
          lib/utils/link_launcher.dart
          test/pages/community_events_page_test.dart
          test/utils/discourse_url_parser_test.dart

      - name: Run cakeday regression tests
        run: >-
          flutter test
          test/pages/community_events_page_test.dart
          test/utils/discourse_url_parser_test.dart
