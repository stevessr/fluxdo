name: Offline Font and Emoji Pack

on:
  pull_request:
    paths:
      - 'packages/offline_resources/**'
      - 'assets/fonts/catalog.json'
      - 'lib/services/fonts/**'
      - 'lib/widgets/common/styled_emoji_image.dart'
      - 'android/app/src/main/kotlin/com/github/lingyan000/fluxdo/ExternalPluginChannel.kt'
      - 'test/services/fonts/offline_resource_pack_test.dart'
      - '.github/workflows/offline-font-emoji-pack.yml'
  push:
    branches: [main]
    paths:
      - 'packages/offline_resources/**'
      - 'assets/fonts/catalog.json'
      - 'lib/services/fonts/emoji_font_service.dart'
      - '.github/workflows/offline-font-emoji-pack.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-font-emoji-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          # Legacy SDK package "tools" was removed from the repository.
          # Install only the modern SDK packages used by build.sh.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Verify Android SDK and install asset tooling
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          for tool in aapt aapt2 d8 zipalign apksigner; do
            test -x "$ANDROID_HOME/build-tools/35.0.0/$tool"
          done
          python -m pip install pillow==12.3.0
      - name: Prepare signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/pack.jks"
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEY_PROPERTIES" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$key"
            alias="$(printf '%s\n' "$KEY_PROPERTIES" | sed -n 's/^keyAlias=//p')"
            store="$(printf '%s\n' "$KEY_PROPERTIES" | sed -n 's/^storePassword=//p')"
            pass="$(printf '%s\n' "$KEY_PROPERTIES" | sed -n 's/^keyPassword=//p')"
          else
            fallback="$(awk -F'"' '/^[[:space:]]*FALLBACK_KEYSTORE_BASE64:/ {print $2; exit}' .github/workflows/build.yaml)"
            test -n "$fallback"
            echo "$fallback" | base64 -d > "$key"
            alias=fluxdodebugkey
            store=fluxdokey
            pass=fluxdokey
          fi
          echo "::add-mask::$store"
          echo "::add-mask::$pass"
          printf 'PACK_KEYSTORE=%s\nPACK_KEY_ALIAS=%s\nPACK_STORE_PASSWORD=%s\nPACK_KEY_PASSWORD=%s\n' "$key" "$alias" "$store" "$pass" >> "$GITHUB_ENV"
      - run: bash packages/offline_resources/build.sh "$RUNNER_TEMP/offline-pack"
      - uses: actions/upload-artifact@v4
        with:
          name: fluxdo-offline-font-emoji
          path: ${{ runner.temp }}/offline-pack/fluxdo-offline-font-emoji.apk
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: fluxdo-nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fluxdo-offline-font-emoji
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create nightly --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Fluxdo Nightly" --prerelease --latest=false --notes "Nightly builds and optional APKs."
          fi
          gh release upload nightly fluxdo-offline-font-emoji.apk --repo "$GITHUB_REPOSITORY" --clobber
