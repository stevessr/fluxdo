name: Temporary Preload Native Fast Path Patch

on:
  push:
    branches:
      - perf/preload-native-fastpath-v3
    paths:
      - tools/_tmp_apply_preload_native_fastpath.py
      - .github/workflows/_tmp_preload_native_fastpath.yml

permissions:
  contents: write

concurrency:
  group: tmp-preload-native-fastpath
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: perf/preload-native-fastpath-v3
          fetch-depth: 0
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Apply patch
        run: python3 tools/_tmp_apply_preload_native_fastpath.py

      - name: Remove temporary helpers
        run: |
          rm tools/_tmp_apply_preload_native_fastpath.py
          rm .github/workflows/_tmp_preload_native_fastpath.yml

      - name: Format touched Dart files
        run: |
          dart format \
            lib/services/browser_trust_coordinator.dart \
            lib/services/preloaded_data_service.dart \
            test/services/browser_trust_preload_latency_contract_test.dart \
            test/services/preloaded_data_progress_test.dart

      - name: Prepare dependencies
        run: |
          mkdir -p assets/certs
          flutter pub get

      - name: Analyze preload path
        run: >-
          flutter analyze
          lib/services/browser_trust_coordinator.dart
          lib/services/preloaded_data_service.dart
          test/services/browser_trust_preload_latency_contract_test.dart
          test/services/preloaded_data_progress_test.dart

      - name: Run preload contract tests
        run: >-
          dart tool/flutterw.dart test
          test/services/browser_trust_preload_latency_contract_test.dart
          test/services/preloaded_data_progress_test.dart

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'perf(preload): prefer native fast path before WebView fallback'
          git push origin HEAD:perf/preload-native-fastpath-v3
