name: Format preload PR 89

on:
  push:
    branches:
      - perf/preload-upstream-wait-fastpath

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Format target
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/pages/topics_screen.dart
          git diff --check
          git add lib/pages/topics_screen.dart
          if git diff --cached --quiet; then
            echo 'No formatting changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(preload): format topics screen after progress removal'
          git push origin HEAD:perf/preload-upstream-wait-fastpath
