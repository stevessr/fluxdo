name: Validate reply composer

on:
  push:
    branches: ["feat/discourse-reply-composer"]

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discourse-reply-composer
          fetch-depth: 0
          submodules: recursive

      - name: Apply scoped analyzer fix
        run: python3 .github/scripts/fix_reply_composer_analyzer.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze reply composer
        run: flutter analyze lib/widgets/post/reply_sheet.dart

      - name: Validate diff and finalize branch
        shell: bash
        run: |
          git diff --check
          rm .github/workflows/validate-reply-composer.yml
          rm .github/scripts/fix_reply_composer_analyzer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(composer): make action selector analyzer-safe"
          git push origin HEAD:feat/discourse-reply-composer
