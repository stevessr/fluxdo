name: Temporary size audit

on:
  push:
    branches:
      - perf/slim-build-artifacts

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Resolve dependency graph
        run: |
          flutter pub get
          dart pub deps --json > /tmp/pub-deps.json
      - name: Audit dependency references and tracked payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import json, os, re, subprocess

          root = Path('.').resolve()
          pubspec = Path('pubspec.yaml').read_text(encoding='utf-8')
          section = pubspec.split('\ndependencies:\n', 1)[1].split('\ndependency_overrides:\n', 1)[0]
          deps = []
          for line in section.splitlines():
              m = re.match(r'^  ([A-Za-z0-9_]+):(?:\s|$)', line)
              if m:
                  deps.append(m.group(1))

          dart_files = [p for p in Path('.').rglob('*.dart') if '.dart_tool' not in p.parts and 'build' not in p.parts]
          dart_texts = {}
          for p in dart_files:
              try:
                  dart_texts[p] = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  pass

          print('=== ROOT DIRECT DEPENDENCY PACKAGE IMPORT COUNTS ===')
          no_import = []
          for dep in deps:
              needle = f'package:{dep}/'
              count = sum(t.count(needle) for t in dart_texts.values())
              print(f'{dep}: {count}')
              if count == 0 and dep not in {'flutter', 'flutter_localizations'}:
                  no_import.append(dep)

          all_text_files = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'build' in p.parts or '.dart_tool' in p.parts:
                  continue
              if p.name in {'pubspec.yaml', 'pubspec.lock', 'tmp-size-audit.yaml'}:
                  continue
              if p.suffix.lower() not in {'.dart','.kt','.java','.kts','.yaml','.yml','.md','.json','.xml','.sh','.ps1','.cmake','.txt','.swift','.m','.mm','.cc','.cpp','.h'}:
                  continue
              try:
                  all_text_files.append((p, p.read_text(encoding='utf-8')))
              except UnicodeDecodeError:
                  pass

          print('\n=== ZERO-IMPORT DIRECT DEPENDENCIES: REPO STRING REFS ===')
          for dep in no_import:
              hits = [str(p) for p, t in all_text_files if dep in t]
              print(f'{dep}: {len(hits)} refs {hits[:12]}')

          graph = json.loads(Path('/tmp/pub-deps.json').read_text())
          packages = graph.get('packages', [])
          parents = {d: [] for d in no_import}
          for pkg in packages:
              name = pkg.get('name')
              for child in pkg.get('dependencies', []):
                  if child in parents:
                      parents[child].append(name)
          print('\n=== ZERO-IMPORT DIRECT DEPENDENCIES: REVERSE PUB EDGES ===')
          for dep in no_import:
              print(f'{dep}: parents={parents[dep]}')

          config = json.loads(Path('.dart_tool/package_config.json').read_text())
          cfg = {p['name']: p for p in config['packages']}
          print('\n=== ZERO-IMPORT DIRECT DEPENDENCIES: PACKAGE METADATA ===')
          for dep in no_import:
              item = cfg.get(dep)
              if not item:
                  print(f'{dep}: package_config missing')
                  continue
              uri = item['rootUri']
              parsed = urlparse(uri)
              if parsed.scheme == 'file':
                  package_root = Path(unquote(parsed.path))
              else:
                  package_root = (Path('.dart_tool') / uri).resolve()
              ps = package_root / 'pubspec.yaml'
              text = ps.read_text(encoding='utf-8', errors='ignore') if ps.exists() else ''
              plugin = '\n  plugin:' in text or '\n    plugin:' in text or 'plugin:\n' in text
              total = 0
              files = 0
              if package_root.exists():
                  for q in package_root.rglob('*'):
                      if q.is_file():
                          try:
                              total += q.stat().st_size
                              files += 1
                          except OSError:
                              pass
              print(f'{dep}: plugin={plugin} source_bytes={total} files={files} root={package_root}')

          print('\n=== ANDROID TARGETED REFERENCE CHECK ===')
          android_sources = []
          for ext in ('*.kt','*.java'):
              android_sources += list(Path('android/app/src').rglob(ext))
          android_text = '\n'.join(p.read_text(encoding='utf-8', errors='ignore') for p in android_sources)
          for label, needles in {
              'org.json': ['org.json', 'JSONObject', 'JSONArray'],
              'androidx.webkit': ['androidx.webkit', 'WebViewFeature', 'CookieManagerCompat', 'WebSettingsCompat'],
          }.items():
              found = sorted({n for n in needles if n in android_text})
              print(f'{label}: {found}')

          print('\n=== BUNDLED-ASSET REFERENCE CHECK ===')
          for needle in ['compat-polyfill.js', 'assets/polyfill/', 'discourse-cook.js', 'assets/cook/']:
              hits = [str(p) for p, t in all_text_files if needle in t]
              print(f'{needle}: {hits[:20]}')

          print('\n=== TOP 60 TRACKED FILES BY SIZE ===')
          tracked = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          rows = []
          for name in tracked:
              if not name:
                  continue
              p = Path(name)
              if p.exists() and p.is_file():
                  rows.append((p.stat().st_size, name))
          for size, name in sorted(rows, reverse=True)[:60]:
              print(f'{size:>12}  {name}')
          PY
