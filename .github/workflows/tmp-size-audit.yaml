name: Temporary size audit

on:
  push:
    branches:
      - perf/slim-build-artifacts

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify localization generation
        run: dart tool/gen_l10n.dart --check
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Audit Font Awesome payload and usage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import json, re

          files = []
          names = set()
          dynamic = []
          for p in Path('.').rglob('*.dart'):
              if '.dart_tool' in p.parts or 'build' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              if 'font_awesome_flutter' in text or 'FontAwesomeIcons.' in text or 'fontAwesomeNameMapping' in text:
                  files.append(str(p))
                  names.update(re.findall(r'FontAwesomeIcons\.([A-Za-z0-9_]+)', text))
                  if 'fontAwesomeNameMapping' in text:
                      dynamic.append(str(p))

          print('=== FONT AWESOME SOURCE FILES ===')
          for p in sorted(files):
              print(p)
          print('\n=== STATIC FONT AWESOME ICON NAMES ===')
          for name in sorted(names):
              print(name)
          print(f'count={len(names)}')
          print('\n=== DYNAMIC NAME-MAPPING USERS ===')
          for p in sorted(dynamic):
              print(p)

          config = json.loads(Path('.dart_tool/package_config.json').read_text())
          item = next(p for p in config['packages'] if p['name'] == 'font_awesome_flutter')
          uri = item['rootUri']
          parsed = urlparse(uri)
          root = Path(unquote(parsed.path)) if parsed.scheme == 'file' else (Path('.dart_tool') / uri).resolve()
          print('\n=== FONT AWESOME FONT FILES ===')
          total = 0
          for p in sorted([*root.rglob('*.ttf'), *root.rglob('*.otf')]):
              size = p.stat().st_size
              total += size
              print(f'{size:>10} {p}')
          print(f'total_font_bytes={total}')
          PY
