name: Proactive CF Preload

on:
  push:
    branches:
      - feat/proactive-cf-verification-before-preload
    paths:
      - 'lib/main.dart'
      - 'lib/providers/preferences_provider.dart'
      - 'lib/services/cf_challenge_service.dart'
      - 'lib/services/browser_trust_coordinator.dart'
      - 'lib/settings/definitions/custom_settings_defs.dart'
      - 'test/services/proactive_cf_preload_contract_test.dart'
      - 'test/services/browser_trust_preload_latency_contract_test.dart'
      - '.github/workflows/proactive-cf-preload.yml'
  pull_request:
    paths:
      - 'lib/main.dart'
      - 'lib/providers/preferences_provider.dart'
      - 'lib/services/cf_challenge_service.dart'
      - 'lib/services/browser_trust_coordinator.dart'
      - 'lib/settings/definitions/custom_settings_defs.dart'
      - 'test/services/proactive_cf_preload_contract_test.dart'
      - 'test/services/browser_trust_preload_latency_contract_test.dart'
      - '.github/workflows/proactive-cf-preload.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
      - 'packages/common_ui/**'
      - 'tool/gen_l10n.dart'
      - 'tool/flutterw.dart'
      - 'tool/project_prep.dart'
      - 'lib/l10n/**'
      - '.github/workflows/_check-scope.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: proactive-cf-preload-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    uses: ./.github/workflows/_check-scope.yml
    with:
      workflow_file: .github/workflows/proactive-cf-preload.yml
      patterns: >-
        ["lib/main.dart","lib/providers/preferences_provider.dart","lib/services/cf_challenge_service.dart","lib/services/browser_trust_coordinator.dart","lib/settings/definitions/custom_settings_defs.dart","test/services/proactive_cf_preload_contract_test.dart","test/services/browser_trust_preload_latency_contract_test.dart",".github/workflows/proactive-cf-preload.yml","pubspec.yaml","pubspec.lock",".fvmrc","packages/common_ui/**","tool/gen_l10n.dart","tool/flutterw.dart","tool/project_prep.dart","lib/l10n/**",".github/workflows/_check-scope.yml"]

  verify:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - name: Install Flutter Linux native hook dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Prepare assets
        run: mkdir -p assets/certs assets/images/llm

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: dart run tool/gen_l10n.dart

      # 存量格式差异继续报告，但不阻断导航相关回归用例执行。
      - name: Check changed Dart formatting (legacy baseline advisory)
        continue-on-error: true
        run: |
          dart format \
            lib/main.dart \
            lib/providers/preferences_provider.dart \
            lib/services/cf_challenge_service.dart \
            lib/services/browser_trust_coordinator.dart \
            lib/settings/definitions/custom_settings_defs.dart \
            test/services/proactive_cf_preload_contract_test.dart
          git diff --exit-code -- lib/main.dart lib/providers/preferences_provider.dart lib/services/cf_challenge_service.dart lib/services/browser_trust_coordinator.dart lib/settings/definitions/custom_settings_defs.dart test/services/proactive_cf_preload_contract_test.dart

      - name: Analyze changed code
        run: |
          flutter analyze --no-fatal-infos \
            lib/main.dart \
            lib/providers/preferences_provider.dart \
            lib/services/cf_challenge_service.dart \
            lib/services/browser_trust_coordinator.dart \
            lib/settings/definitions/custom_settings_defs.dart \
            test/services/proactive_cf_preload_contract_test.dart

      - name: Run preload regression tests
        run: |
          dart tool/flutterw.dart test \
            test/services/proactive_cf_preload_contract_test.dart \
            test/services/browser_trust_preload_latency_contract_test.dart
