name: Parallel Topic and Site Info Regression

on:
  pull_request:
    paths:
      - 'lib/pages/topic_detail_page/topic_detail_page.dart'
      - 'lib/pages/site_info_page.dart'
      - 'lib/pages/site_policy_page.dart'
      - 'lib/models/site_info_section.dart'
      - 'lib/utils/link_launcher.dart'
      - 'lib/widgets/layout/master_detail_pane_host.dart'
      - 'test/models/site_info_section_test.dart'
      - 'test/pages/site_info_page_test.dart'
      - 'test/providers/selected_topic_provider_test.dart'
      - 'test/widgets/layout/unified_topic_tabs_test.dart'
      - '.github/workflows/parallel-topic-site-info-regression.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
      - 'packages/common_ui/**'
      - 'tool/gen_l10n.dart'
      - 'tool/flutterw.dart'
      - 'tool/project_prep.dart'
      - 'lib/l10n/**'
      - '.github/workflows/_check-scope.yml'
      - 'lib/widgets/layout/pico_parallel_tabs.dart'
      - 'lib/providers/selected_topic_provider.dart'
      - 'test/pages/topic_detail_page/topic_more_menu_actions_test.dart'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scope:
    uses: ./.github/workflows/_check-scope.yml
    with:
      workflow_file: .github/workflows/parallel-topic-site-info-regression.yml
      patterns: >-
        ["lib/pages/topic_detail_page/topic_detail_page.dart","lib/pages/site_info_page.dart","lib/pages/site_policy_page.dart","lib/models/site_info_section.dart","lib/utils/link_launcher.dart","lib/widgets/layout/master_detail_pane_host.dart","test/models/site_info_section_test.dart","test/pages/site_info_page_test.dart","test/providers/selected_topic_provider_test.dart","test/widgets/layout/unified_topic_tabs_test.dart",".github/workflows/parallel-topic-site-info-regression.yml","pubspec.yaml","pubspec.lock",".fvmrc","packages/common_ui/**","tool/gen_l10n.dart","tool/flutterw.dart","tool/project_prep.dart","lib/l10n/**",".github/workflows/_check-scope.yml","lib/widgets/layout/pico_parallel_tabs.dart","lib/providers/selected_topic_provider.dart","test/pages/topic_detail_page/topic_more_menu_actions_test.dart"]

  verify:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - name: Install Flutter Linux native hook dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libx11-dev libxi-dev
      - name: Prepare generated directories
        run: mkdir -p assets/certs assets/images/llm
      - name: Resolve packages and localizations
        run: |
          flutter pub get
          dart run tool/gen_l10n.dart
      - name: Analyze changed navigation paths
        run: >-
          flutter analyze --no-fatal-infos --no-fatal-warnings
          lib/models/site_info_section.dart
          lib/pages/site_info_page.dart
          lib/pages/site_policy_page.dart
          lib/pages/topic_detail_page/topic_detail_page.dart
          lib/utils/link_launcher.dart
          lib/widgets/layout/master_detail_pane_host.dart
      - name: Test unified tabs and information routing
        run: >-
          flutter test
          test/models/site_info_section_test.dart
          test/pages/site_info_page_test.dart
          test/providers/selected_topic_provider_test.dart
          test/widgets/layout/unified_topic_tabs_test.dart
          test/pages/topic_detail_page/topic_more_menu_actions_test.dart
