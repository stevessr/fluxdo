name: Patch category drawer more entries

on:
  push:
    branches:
      - feat/category-drawer-more-all-nav
    paths:
      - .github/workflows/patch-category-drawer-more-all-nav.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Patch drawer
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/widgets/topic/category_drawer.dart')
          text = path.read_text()

          old_ids = """  static const List<String> _moreEntryIds = [
            'chat',
            'messages',
            'ai_bot',
            'leaderboard',
            'groups',
            'upcoming_events',
          ];

"""
          if old_ids not in text:
              raise SystemExit('old _moreEntryIds block not found')
          text = text.replace(old_ids, '', 1)

          old_more = """  /// App-level destinations exposed from the category drawer.
          Widget _buildMoreList(bool isLoggedIn) {
            final entries = _moreEntryIds
                .map(NavEntryRegistry.byId)
                .whereType<NavEntry>()
                .where((entry) => !entry.requiresLogin || isLoggedIn)
                .toList(growable: false);

            return ListView(
              padding: const EdgeInsets.fromLTRB(12, 4, 12, 24),
              children: [
                for (final entry in entries)
                  _MoreNavRow(
                    icon: entry.iconData,
                    label: entry.label(context),
                    onTap: () {
                      final pageBuilder = entry.pageBuilder;
                      if (pageBuilder == null) return;
                      _closeAndPush(pageBuilder(context, true));
                    },
                  ),
              ],
            );
          }
"""

          new_more = """  /// Open any destination supported by the configurable bottom nav.
          void _openMoreEntry(NavEntry entry) {
            switch (entry.kind) {
              case NavEntryKind.page:
                final pageBuilder = entry.pageBuilder;
                if (pageBuilder == null) return;
                _closeAndPush(pageBuilder(context, true));
              case NavEntryKind.panel:
                final onPanelTap = entry.onPanelTap;
                if (onPanelTap == null) return;
                widget.onRequestClose();
                onPanelTap(context, ref);
              case NavEntryKind.action:
                final onAction = entry.onAction;
                if (onAction == null) return;
                widget.onRequestClose();
                onAction(context, ref);
            }
          }

          /// All user-addable bottom-nav destinations exposed from the drawer.
          Widget _buildMoreList(bool isLoggedIn) {
            final entries = NavEntryRegistry.buildAll()
                .where((entry) => !entry.locked)
                .where((entry) => !entry.requiresLogin || isLoggedIn)
                .toList(growable: false);

            return ListView(
              padding: const EdgeInsets.fromLTRB(12, 4, 12, 24),
              children: [
                for (final entry in entries)
                  _MoreNavRow(
                    icon: entry.iconData,
                    label: entry.label(context),
                    onTap: () => _openMoreEntry(entry),
                  ),
              ],
            );
          }
"""

          if old_more not in text:
              raise SystemExit('old _buildMoreList block not found')
          text = text.replace(old_more, new_more, 1)
          path.write_text(text)
          PY

      - name: Format and analyze
        run: |
          dart format lib/widgets/topic/category_drawer.dart
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/widgets/topic/category_drawer.dart
          git diff --check

      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/patch-category-drawer-more-all-nav.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/widgets/topic/category_drawer.dart .github/workflows/patch-category-drawer-more-all-nav.yml
          git commit -m "feat: expose all bottom nav entries in drawer more"
          git push
