name: Temporary sync compile resolver

on:
  push:
    branches:
      - sync/upstream-20260905
    paths:
      - '.github/workflows/temp-sync-fix-compile.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve compile leftovers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) PM close helper: upstream refactor is the canonical superset.
          p = Path('lib/pages/topic_detail_page/topic_detail_page.dart')
          text = p.read_text()
          old = '''  void _closeRemovedPrivateMessage() {\n    ref.invalidate(pmInboxProvider);\n    ref.invalidate(pmSentProvider);\n    ref.invalidate(pmArchiveProvider);\n    if (!mounted) return;\n    // 被移出后必须直接离开私信，不能复用 Esc 语义：\n    // 后者会在搜索或 AI 页中只退出子模式，仍把无权访问的私信留在屏幕上。\n    if (widget.embeddedMode) {\n      widget.onEmbeddedBack?.call();\n      return;\n    }\n    Navigator.of(context).maybePop();\n  }\n\n'''
          if text.count('void _closeRemovedPrivateMessage()') != 2:
              raise SystemExit('unexpected PM helper count')
          if old not in text:
              raise SystemExit('old PM helper block not found')
          p.write_text(text.replace(old, '', 1))

          # 2) Preserve the fork compatibility index model used by getIndex/getAllGroups.
          p = Path('lib/models/sticker.dart')
          text = p.read_text()
          if 'class StickerMarketIndex' not in text:
              compat = '''/// 表情包市场索引信息（旧 API 兼容层）。\n///\n/// 新市场浏览以分类页自己的 totalPages 为准，但 fork 仍有 getIndex /\n/// getAllGroups 调用；保留此模型避免升级后破坏旧调用。\nclass StickerMarketIndex {\n  final int totalPages;\n  final int pageSize;\n  final int totalGroups;\n\n  const StickerMarketIndex({\n    required this.totalPages,\n    required this.pageSize,\n    required this.totalGroups,\n  });\n\n  factory StickerMarketIndex.fromJson(Map<String, dynamic> json) {\n    return StickerMarketIndex(\n      totalPages: json['totalPages'] as int? ?? 0,\n      pageSize: json['pageSize'] as int? ?? 0,\n      totalGroups: json['totalGroups'] as int? ?? 0,\n    );\n  }\n}\n\n'''
              p.write_text(compat + text)

          # 3) StickerPicker moved from the removed all-market provider to the
          # subscribed-groups single source of truth.
          p = Path('lib/widgets/markdown_editor/sticker_picker.dart')
          text = p.read_text()
          old = 'ref.invalidate(stickerGroupsProvider)'
          new = 'ref.invalidate(subscribedStickerGroupsProvider)'
          if old not in text:
              raise SystemExit('old stickerGroupsProvider retry marker not found')
          p.write_text(text.replace(old, new, 1))
          PY

          rm -f .github/workflows/temp-sync-fix-compile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(sync): resolve PM and sticker compile leftovers'
          git push origin HEAD:sync/upstream-20260905
