name: Topic Board Picker PR Check

on:
  pull_request:
    paths:
      - 'lib/widgets/topic/add_to_board_sheet.dart'
      - 'lib/pages/topic_detail_page/topic_detail_page.dart'
      - 'lib/pages/topic_detail_page/topic_more_menu_actions.dart'
      - 'test/pages/topic_detail_page/topic_more_menu_actions_test.dart'
      - '.github/workflows/topic-board-picker-pr-check.yml'

permissions:
  contents: read

jobs:
  board-picker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - run: mkdir -p assets/certs
      - run: flutter pub get
      - run: dart run tool/gen_l10n.dart
      - name: Analyze board picker and topic menu
        run: flutter analyze lib/widgets/topic/add_to_board_sheet.dart lib/pages/topic_detail_page/topic_more_menu_actions.dart
      - name: Test topic menu routing
        run: flutter test test/pages/topic_detail_page/topic_more_menu_actions_test.dart
