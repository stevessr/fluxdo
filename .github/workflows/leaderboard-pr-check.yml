name: Leaderboard PR Check

on:
  pull_request:
    paths:
      - 'lib/pages/leaderboard_page.dart'
      - 'lib/utils/leaderboard_period_range.dart'
      - 'test/utils/leaderboard_period_range_test.dart'
      - '.github/workflows/leaderboard-pr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaderboard-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true

      - name: Prepare assets
        run: mkdir -p assets/certs

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: dart run tool/gen_l10n.dart

      - name: Check Dart parsing and analyzer
        run: |
          flutter analyze --no-pub lib/pages/leaderboard_page.dart lib/utils/leaderboard_period_range.dart test/utils/leaderboard_period_range_test.dart

      - name: Run leaderboard date-range tests
        run: flutter test --no-pub test/utils/leaderboard_period_range_test.dart

      - name: Check whitespace
        run: git diff --check
