name: Android optional plugin APKs

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/android-independent-plugin-apks'
    paths:
      - 'android/plugin_*/**'
      - 'android/app/src/main/kotlin/com/github/lingyan000/fluxdo/OptionalPluginChannel.kt'
      - 'android/settings.gradle.kts'
      - 'android_companions/**'
      - 'scripts/ci/build_sticker_companion.py'
      - 'scripts/ci/build_android_core_modular.py'
      - 'android_modular/**'
      - 'scripts/ci/check_android_plugin_contract.py'
      - 'lib/services/android_optional_plugin_service.dart'
      - 'lib/pages/android_plugins_page.dart'
      - 'lib/pages/metaverse_page.dart'
      - 'lib/services/android_sticker_companion_service.dart'
      - 'lib/services/stevessr_composer_service.dart'
      - 'test/services/android_sticker_companion_service_test.dart'
      - '.github/workflows/android-plugin-apks.yml'
  pull_request:
    paths:
      - 'android/plugin_*/**'
      - 'android/app/src/main/kotlin/com/github/lingyan000/fluxdo/OptionalPluginChannel.kt'
      - 'android/settings.gradle.kts'
      - 'android_companions/**'
      - 'scripts/ci/build_sticker_companion.py'
      - 'scripts/ci/check_android_plugin_contract.py'
      - 'lib/services/android_optional_plugin_service.dart'
      - 'lib/pages/android_plugins_page.dart'
      - 'lib/pages/metaverse_page.dart'
      - 'lib/services/android_sticker_companion_service.dart'
      - 'lib/services/stevessr_composer_service.dart'
      - 'test/services/android_sticker_companion_service_test.dart'
      - '.github/workflows/android-plugin-apks.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Validate standalone APK build scripts
        run: python3 -m py_compile scripts/ci/build_sticker_companion.py scripts/ci/build_android_core_modular.py scripts/ci/check_android_plugin_contract.py
      - name: Check plugin IPC manifests and allowlist
        run: python3 scripts/ci/check_android_plugin_contract.py
      - name: Prepare generated locale and avatar assets
        run: dart tool/project_prep.dart test
      - name: Analyze Flutter plugin manager
        run: |
          dart analyze lib/services/android_optional_plugin_service.dart
          dart analyze lib/pages/android_plugins_page.dart
      - name: Analyze new companion callsites
        run: |
          dart analyze lib/services/android_sticker_companion_service.dart
          dart analyze lib/services/stevessr_composer_service.dart
          dart analyze lib/pages/metaverse_page.dart
      - name: Test companion result protocol
        run: flutter test test/services/android_sticker_companion_service_test.dart
      - name: Build independent Flutter sticker APK
        run: python3 scripts/ci/build_sticker_companion.py --mode debug --abi android-arm64
      - name: Build all five native APKs (debug test-signing only)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon :plugin_deviceinfo:assembleDebug :plugin_network:assembleDebug :plugin_cdk:assembleDebug :plugin_ldc:assembleDebug :plugin_ldc_reward:assembleDebug
      - name: Compile lean Android Core APK (Dart AOT resources isolated)
        run: |
          python3 scripts/ci/build_android_core_modular.py --mode debug --abi android-arm64
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Compile core host Kotlin integration
        run: |
          cd android
          ./gradlew --no-daemon :app:compileDebugKotlin
      - name: Validate produced APKs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/plugin_deviceinfo/outputs/apk/debug/plugin_deviceinfo-debug.apk
          test -s build/plugin_network/outputs/apk/debug/plugin_network-debug.apk
          test -s build/plugin_cdk/outputs/apk/debug/plugin_cdk-debug.apk
          test -s build/plugin_ldc/outputs/apk/debug/plugin_ldc-debug.apk
          test -s build/plugin_ldc_reward/outputs/apk/debug/plugin_ldc_reward-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fluxdo-deviceinfo-debug-apk
          path: build/plugin_deviceinfo/outputs/apk/debug/plugin_deviceinfo-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: fluxdo-network-debug-apk
          path: build/plugin_network/outputs/apk/debug/plugin_network-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: fluxdo-sticker-arm64-debug-apk
          path: build/plugin_sticker/fluxdo-sticker-android-arm64-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: fluxdo-cdk-debug-apk
          path: build/plugin_cdk/outputs/apk/debug/plugin_cdk-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: fluxdo-ldc-debug-apk
          path: build/plugin_ldc/outputs/apk/debug/plugin_ldc-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: fluxdo-ldc-reward-debug-apk
          path: build/plugin_ldc_reward/outputs/apk/debug/plugin_ldc_reward-debug.apk
          if-no-files-found: error
