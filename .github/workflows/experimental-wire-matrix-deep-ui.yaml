name: Wire Matrix deep UI once

on:
  push:
    branches:
      - feat/experimental-matrix-telegram
    paths:
      - '.github/workflows/experimental-wire-matrix-deep-ui.yaml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/experimental-matrix-telegram
          fetch-depth: 0
      - name: Patch Matrix room page
        run: |
          python3 tool/experimental_wire_matrix_deep_ui.py
          dart format lib/pages/chat/matrix_room_page.dart || true
          git diff --check
      - name: Commit wiring
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/chat/matrix_room_page.dart
          git commit -m 'feat(matrix): wire streaming media and thread UI into room'
          git push origin HEAD:feat/experimental-matrix-telegram
