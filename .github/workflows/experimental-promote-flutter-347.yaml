name: Promote Flutter 3.47 in release workflows

on:
  push:
    branches:
      - feat/experimental-matrix-telegram
    paths:
      - '.github/workflows/experimental-promote-flutter-347.yaml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/experimental-matrix-telegram
          fetch-depth: 0

      - name: Promote validated Flutter version
        run: |
          set -euo pipefail
          files=(
            .github/workflows/build-apk.yaml
            .github/workflows/build.yaml
          )

          for file in "${files[@]}"; do
            sed -i \
              -e "s/'3\\.44\\.0'/'3.47.2'/g" \
              -e 's/Flutter 3\.44/Flutter 3.47/g' \
              "$file"
          done

          if grep -nE "3\\.44\\.0|Flutter 3\\.44" "${files[@]}"; then
            echo '旧 Flutter 3.44 pin 仍然存在' >&2
            exit 1
          fi

          grep -nE "3\\.47\\.2|Flutter 3\\.47" "${files[@]}"
          git diff --check
          git diff -- "${files[@]}"

      - name: Commit migration
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/build-apk.yaml .github/workflows/build.yaml; then
            echo '发布 workflow 已经是 Flutter 3.47.2，无需提交'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-apk.yaml .github/workflows/build.yaml
          git commit -m 'ci: align release workflows with Flutter 3.47.2'
          git push origin HEAD:feat/experimental-matrix-telegram
