name: Account Runtime Switch

on:
  push:
    branches:
      - feat/account-runtime-switching
    paths:
      - 'lib/services/account_runtime_pool.dart'
      - 'lib/services/discourse/discourse_service.dart'
      - 'lib/services/discourse/_account_switch.dart'
      - 'test/services/account_runtime_pool_test.dart'
      - '.github/workflows/account-runtime-switch.yaml'
  pull_request:
    paths:
      - 'lib/services/account_runtime_pool.dart'
      - 'lib/services/discourse/discourse_service.dart'
      - 'lib/services/discourse/_account_switch.dart'
      - 'test/services/account_runtime_pool_test.dart'
      - '.github/workflows/account-runtime-switch.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format runtime switching sources
        run: >-
          dart format
          lib/services/account_runtime_pool.dart
          lib/services/discourse/discourse_service.dart
          lib/services/discourse/_account_switch.dart
          test/services/account_runtime_pool_test.dart

      - name: Commit formatter changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/account-runtime-switching'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/services/account_runtime_pool.dart \
            lib/services/discourse/discourse_service.dart \
            lib/services/discourse/_account_switch.dart \
            test/services/account_runtime_pool_test.dart
          git commit -m 'style: format account runtime switching'
          git push

      - name: Ensure formatting is clean
        run: git diff --exit-code

      - name: Analyze runtime switching
        run: >-
          flutter analyze
          lib/services/account_runtime_pool.dart
          lib/services/discourse/discourse_service.dart
          test/services/account_runtime_pool_test.dart

      - name: Test runtime pool
        run: flutter test test/services/account_runtime_pool_test.dart
