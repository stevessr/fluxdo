name: Account Runtime Switch

on:
  pull_request:
    paths:
      - 'lib/services/account_runtime_pool.dart'
      - 'lib/services/account_switch_browser_cookie_cleaner.dart'
      - 'lib/services/network/cookie/raw_cookie_writer.dart'
      - 'lib/services/discourse/discourse_service.dart'
      - 'lib/services/discourse/_account_switch.dart'
      - 'lib/services/storage/multi_account_registry_normalizer.dart'
      - 'lib/services/storage/resilient_secure_storage.dart'
      - 'test/services/account_runtime_pool_test.dart'
      - 'test/services/storage/multi_account_registry_normalizer_test.dart'
      - 'lib/services/discourse/_auth.dart'
      - 'lib/services/network/session_rejection_classifier.dart'
      - 'lib/services/network/recovery/session_heal_policy.dart'
      - 'test/services/discourse_account_switch_auth_test.dart'
      - 'test/services/network/session_rejection_classifier_test.dart'
      - 'test/services/network/recovery/session_heal_test.dart'
      - '.github/workflows/account-runtime-switch.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Prepare generated asset directories
        run: mkdir -p assets/certs

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format \
            lib/services/account_runtime_pool.dart \
            lib/services/account_switch_browser_cookie_cleaner.dart \
            lib/services/network/cookie/raw_cookie_writer.dart \
            lib/services/discourse/discourse_service.dart \
            lib/services/discourse/_account_switch.dart \
            lib/services/storage/multi_account_registry_normalizer.dart \
            lib/services/storage/resilient_secure_storage.dart \
            test/services/account_runtime_pool_test.dart \
            test/services/storage/multi_account_registry_normalizer_test.dart
          git diff --exit-code -- \
            lib/services/account_runtime_pool.dart \
            lib/services/account_switch_browser_cookie_cleaner.dart \
            lib/services/network/cookie/raw_cookie_writer.dart \
            lib/services/discourse/discourse_service.dart \
            lib/services/discourse/_account_switch.dart \
            lib/services/storage/multi_account_registry_normalizer.dart \
            lib/services/storage/resilient_secure_storage.dart \
            test/services/account_runtime_pool_test.dart \
            test/services/storage/multi_account_registry_normalizer_test.dart

      - name: Analyze runtime switching
        run: >-
          flutter analyze
          lib/services/account_runtime_pool.dart
          lib/services/account_switch_browser_cookie_cleaner.dart
          lib/services/network/cookie/raw_cookie_writer.dart
          lib/services/discourse/discourse_service.dart
          lib/services/storage/multi_account_registry_normalizer.dart
          lib/services/storage/resilient_secure_storage.dart
          test/services/account_runtime_pool_test.dart
          test/services/storage/multi_account_registry_normalizer_test.dart

      - name: Test account runtime
        run: >-
          dart tool/flutterw.dart test
          test/services/account_runtime_pool_test.dart
          test/services/storage/multi_account_registry_normalizer_test.dart

      # 与原有账号运行时测试共用环境，避免再增加一个独立的 PR workflow。
      - name: Check 403 auth guard formatting
        run: |
          dart format \
            lib/services/discourse/_auth.dart \
            lib/services/network/session_rejection_classifier.dart \
            lib/services/network/recovery/session_heal_policy.dart \
            test/services/discourse_account_switch_auth_test.dart \
            test/services/network/session_rejection_classifier_test.dart \
            test/services/network/recovery/session_heal_test.dart

          git diff -- \
            lib/services/discourse/_auth.dart \
            lib/services/network/session_rejection_classifier.dart \
            lib/services/network/recovery/session_heal_policy.dart \
            test/services/discourse_account_switch_auth_test.dart \
            test/services/network/session_rejection_classifier_test.dart \
            test/services/network/recovery/session_heal_test.dart
          git diff --exit-code -- \
            lib/services/discourse/_auth.dart \
            lib/services/network/session_rejection_classifier.dart \
            lib/services/network/recovery/session_heal_policy.dart \
            test/services/discourse_account_switch_auth_test.dart \
            test/services/network/session_rejection_classifier_test.dart \
            test/services/network/recovery/session_heal_test.dart
      - name: Analyze 403 auth guards
        run: >-
          flutter analyze
          lib/services/discourse/discourse_service.dart
          lib/services/network/session_rejection_classifier.dart
          lib/services/network/recovery/session_heal_policy.dart
          test/services/discourse_account_switch_auth_test.dart
          test/services/network/session_rejection_classifier_test.dart
          test/services/network/recovery/session_heal_test.dart

      - name: Test 403 auth guards
        run: >-
          dart tool/flutterw.dart test
          test/services/discourse_account_switch_auth_test.dart
          test/services/network/session_rejection_classifier_test.dart
          test/services/network/recovery/session_heal_test.dart
