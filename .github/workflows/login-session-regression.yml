name: Login Session Regression

on:
  push:
    paths:
      - 'lib/services/login_token_redeemer.dart'
      - 'lib/services/webview_login_session_probe.dart'
      - 'lib/services/network/cookie/app_cookie_manager.dart'
      - 'lib/pages/webview_login_page.dart'
      - 'test/services/login_token_redeemer_test.dart'
      - 'test/services/webview_login_session_probe_test.dart'
      - 'test/services/network/cookie/app_cookie_manager_test.dart'
      - '.github/workflows/login-session-regression.yml'
  pull_request:
    paths:
      - 'lib/services/login_token_redeemer.dart'
      - 'lib/services/webview_login_session_probe.dart'
      - 'lib/services/network/cookie/app_cookie_manager.dart'
      - 'lib/pages/webview_login_page.dart'
      - 'test/services/login_token_redeemer_test.dart'
      - 'test/services/webview_login_session_probe_test.dart'
      - 'test/services/network/cookie/app_cookie_manager_test.dart'
      - '.github/workflows/login-session-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Prepare assets
        run: mkdir -p assets/certs assets/images/llm
      - name: Fetch dependencies
        run: flutter pub get
      - name: Generate localization
        run: dart run tool/gen_l10n.dart
      - name: Check Dart formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/services/login_token_redeemer.dart \
            lib/services/webview_login_session_probe.dart \
            lib/services/network/cookie/app_cookie_manager.dart \
            lib/pages/webview_login_page.dart \
            test/services/login_token_redeemer_test.dart \
            test/services/webview_login_session_probe_test.dart \
            test/services/network/cookie/app_cookie_manager_test.dart
      - name: Analyze authentication changes
        run: >-
          flutter analyze
          lib/services/login_token_redeemer.dart
          lib/services/webview_login_session_probe.dart
          lib/services/network/cookie/app_cookie_manager.dart
          lib/pages/webview_login_page.dart
          test/services/login_token_redeemer_test.dart
          test/services/webview_login_session_probe_test.dart
          test/services/network/cookie/app_cookie_manager_test.dart
      - name: Test authentication regression
        run: >-
          dart tool/flutterw.dart test
          test/services/login_token_redeemer_test.dart
          test/services/webview_login_session_probe_test.dart
          test/services/network/cookie/app_cookie_manager_test.dart
          test/services/user_api_key_login_flow_test.dart
          test/services/login_cf_challenge_classification_test.dart
