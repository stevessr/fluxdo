name: Temporary profile radial bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-experiment:
    if: github.event.head_commit.message == 'chore: bridge profile radial patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/profile-radial-account-switcher
          fetch-depth: 0
      - name: Apply profile radial patch
        run: python3 .github/scripts/profile_radial_patch.py
      - name: Validate diff
        run: git diff --check
      - name: Commit experiment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git commit -m 'feat: restore adaptive profile radial switcher'
          git push origin HEAD:experiment/profile-radial-account-switcher
