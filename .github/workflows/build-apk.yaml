name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'lib/**'
      - 'android/**'
      - 'core/doh_proxy/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yaml'
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target Architecture (default: arm64-v8a)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - 'arm64-v8a'
          - 'armeabi-v7a'
          - 'x86_64'
          - 'universal'
          - 'all'

env:
  ANDROID_NDK_VERSION: '27.3.13750724'

jobs:
  build-apk:
    name: build-apk (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            rust-target: aarch64-linux-android
            flutter-target: android-arm64
          - arch: armeabi-v7a
            rust-target: armv7-linux-androideabi
            flutter-target: android-arm
          - arch: x86_64
            rust-target: x86_64-linux-android
            flutter-target: android-x64
          - arch: universal
            rust-target: all
            flutter-target: universal
    if: |
      (github.event_name == 'push' && matrix.arch == 'arm64-v8a') ||
      (github.event_name == 'workflow_dispatch' && (
        (inputs.arch == 'all') ||
        (inputs.arch == matrix.arch) ||
        (inputs.arch == '' && matrix.arch == 'arm64-v8a')
      ))

    steps:
      - name: Free disk space
        run: |
          echo "清理前:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android/sdk/ndk \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/chromium
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "清理后:" && df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/doh_proxy
          key: android-apk-${{ matrix.arch }}

      - name: Setup Android build environment
        run: |
          if [ "${{ matrix.arch }}" = "universal" ]; then
            rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          else
            rustup target add ${{ matrix.rust-target }}
          fi
          cargo install cargo-ndk
          sudo apt-get update && sudo apt-get install -y cmake

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;${{ env.ANDROID_NDK_VERSION }}'

      - name: Configure Android NDK path
        run: |
          ndk_path="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          test -d "${ndk_path}"
          echo "ANDROID_NDK_HOME=${ndk_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_path}" >> "${GITHUB_ENV}"

      - name: Setup Android Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          else
            echo "ANDROID_KEYSTORE_BASE64 未配置，跳过自签证书创建"
            rm -f android/app/upload-keystore.jks
          fi

          if [ -n "$KEY_PROPERTIES" ]; then
            echo "$KEY_PROPERTIES" > android/key.properties
          else
            echo "ANDROID_KEY_PROPERTIES 未配置，跳过 key.properties 创建"
            rm -f android/key.properties
          fi

          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON 未配置，写入默认 Google Services 配置模版"
            cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "fluxdo-dummy",
              "storage_bucket": "fluxdo-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.github.lingyan000.fluxdo"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildWithoutSecrets0000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build Android APK
        run: |
          if [ "${{ matrix.arch }}" = "universal" ]; then
            dart tool/flutterw.dart build apk --release --dart-define=cronetHttpNoPlay=true
            mkdir -p dist
            mv build/app/outputs/flutter-apk/app-release.apk dist/fluxdo-universal.apk
          else
            dart tool/flutterw.dart build apk --release --target-platform ${{ matrix.flutter-target }} --dart-define=cronetHttpNoPlay=true
            mkdir -p dist
            mv build/app/outputs/flutter-apk/app-release.apk dist/fluxdo-${{ matrix.arch }}.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxdo-apk-${{ matrix.arch }}
          path: dist/*.apk
          retention-days: 90
          if-no-files-found: error
