name: Account Switch Perf Check

on:
  push:
    branches:
      - perf/account-switch-speed-v2
    paths:
      - 'lib/providers/app_state_refresher.dart'
      - 'lib/services/account_manager.dart'
      - 'lib/services/account_switch_browser_cookie_cleaner.dart'
      - 'lib/services/discourse/_account_switch.dart'
      - 'lib/services/discourse/discourse_service.dart'
      - 'lib/services/network/cookie/csrf_token_service.dart'
      - 'tool/gen_l10n.dart'
      - 'tool/gen_slang_compat.dart'
      - 'slang.yaml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/account-switch-perf-check.yml'

concurrency:
  group: account-switch-perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localization sources
        run: dart run tool/gen_l10n.dart

      - name: Analyze account switch sources
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/providers/app_state_refresher.dart
          lib/services/account_manager.dart
          lib/services/account_switch_browser_cookie_cleaner.dart
          lib/services/discourse/discourse_service.dart
          lib/services/network/cookie/csrf_token_service.dart
