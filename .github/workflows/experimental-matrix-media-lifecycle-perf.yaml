name: Apply shared Matrix media transport wiring

on:
  push:
    branches:
      - feat/experimental-matrix-telegram
    paths:
      - '.github/workflows/experimental-matrix-media-lifecycle-perf.yaml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/experimental-matrix-telegram
          fetch-depth: 0

      - name: Apply shared media transport wiring
        run: python3 tool/experimental_matrix_media_lifecycle_perf.py

      - name: Validate patch
        run: |
          git diff --check
          git diff -- \
            lib/pages/chat/matrix_room_page.dart \
            lib/pages/chat/matrix_thread_page.dart \
            lib/pages/chat/matrix_message_media_view.dart

      - name: Commit shared media transport wiring
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/pages/chat/matrix_room_page.dart \
            lib/pages/chat/matrix_thread_page.dart \
            lib/pages/chat/matrix_message_media_view.dart
          git commit -m 'perf(matrix): share media transport across room UI'
          git push origin HEAD:feat/experimental-matrix-telegram
