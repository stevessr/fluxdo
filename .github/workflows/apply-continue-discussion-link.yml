name: Apply continued-discussion composer fix

on:
  push:
    branches: ["fix/composer-continue-discussion-link"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/composer-continue-discussion-link
          fetch-depth: 0
          submodules: recursive

      - name: Apply scoped patch
        run: python3 .github/scripts/apply_continue_discussion_link.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localization
        run: dart run tool/gen_l10n.dart

      - name: Format reply composer
        run: dart format lib/widgets/post/reply_sheet.dart

      - name: Analyze reply composer
        run: flutter analyze lib/widgets/post/reply_sheet.dart

      - name: Validate and finalize branch
        shell: bash
        run: |
          git diff --check
          grep -q 'post_continueDiscussion' lib/l10n/modules/post/post_en.arb
          grep -q 'post_continueDiscussion' lib/l10n/modules/post/post_zh.arb
          grep -q 'post_continueDiscussion' lib/l10n/modules/post/post_zh_TW.arb
          grep -q 'post_continueDiscussion' lib/l10n/modules/post/post_zh_HK.arb
          rm .github/scripts/apply_continue_discussion_link.py
          rm .github/workflows/apply-continue-discussion-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/widgets/post/reply_sheet.dart lib/l10n/modules/post/post_*.arb .github
          git diff --cached --check
          git commit -m "fix(composer): add Discourse continuation backlink"
          git push origin HEAD:fix/composer-continue-discussion-link
