name: Apply Matrix analyzer cleanup

on:
  push:
    branches:
      - feat/experimental-matrix-telegram
    paths:
      - '.github/workflows/experimental-matrix-analyzer-fix.yaml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/experimental-matrix-telegram
          fetch-depth: 0

      - name: Apply analyzer cleanup
        run: python3 tool/experimental_matrix_analyzer_fix.py

      - name: Validate patch
        run: |
          git diff --check
          git diff -- \
            lib/pages/chat/matrix_room_page.dart \
            lib/pages/chat/matrix_message_media_view.dart \
            lib/services/matrix_client_service.dart

      - name: Commit analyzer cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/pages/chat/matrix_room_page.dart \
            lib/pages/chat/matrix_message_media_view.dart \
            lib/services/matrix_client_service.dart
          git commit -m 'fix(matrix): resolve thread UI type ambiguity'
          git push origin HEAD:feat/experimental-matrix-telegram
