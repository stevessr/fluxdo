name: Mini App Directory

on:
  pull_request:
    paths:
      - 'lib/models/mini_app.dart'
      - 'lib/pages/mini_apps_page.dart'
      - 'lib/pages/mini_app_runtime_page.dart'
      - 'lib/models/mini_app_runtime.dart'
      - 'lib/services/mini_app_runtime_repository.dart'
      - 'test/models/mini_app_runtime_test.dart'
      - 'test/services/mini_app_runtime_repository_test.dart'
      - 'lib/services/mini_app_directory_repository.dart'
      - 'test/models/mini_app_test.dart'
      - 'test/services/mini_app_directory_repository_test.dart'
      - '.github/workflows/mini-app-directory-check.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
      - 'packages/common_ui/**'
      - 'tool/gen_l10n.dart'
      - 'tool/flutterw.dart'
      - 'tool/project_prep.dart'
      - 'lib/l10n/**'
      - '.github/workflows/_check-scope.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mini-app-directory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    uses: ./.github/workflows/_check-scope.yml
    with:
      workflow_file: .github/workflows/mini-app-directory-check.yml
      patterns: >-
        ["lib/models/mini_app.dart","lib/pages/mini_apps_page.dart","lib/pages/mini_app_runtime_page.dart","lib/models/mini_app_runtime.dart","lib/services/mini_app_runtime_repository.dart","test/models/mini_app_runtime_test.dart","test/services/mini_app_runtime_repository_test.dart","lib/services/mini_app_directory_repository.dart","test/models/mini_app_test.dart","test/services/mini_app_directory_repository_test.dart",".github/workflows/mini-app-directory-check.yml","pubspec.yaml","pubspec.lock",".fvmrc","packages/common_ui/**","tool/gen_l10n.dart","tool/flutterw.dart","tool/project_prep.dart","lib/l10n/**",".github/workflows/_check-scope.yml"]

  verify:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - name: Install Flutter Linux native hook dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Prepare assets
        run: mkdir -p assets/certs

      - name: Install dependencies
        run: flutter pub get

      - name: Generate translations
        run: dart run tool/gen_l10n.dart

      - name: Analyze mini app directory
        run: >-
          flutter analyze --no-fatal-infos --no-fatal-warnings
          lib/models/mini_app.dart
          lib/pages/mini_apps_page.dart
          lib/pages/mini_app_runtime_page.dart
          lib/models/mini_app_runtime.dart
          lib/services/mini_app_runtime_repository.dart
          lib/services/mini_app_directory_repository.dart
          test/models/mini_app_test.dart
          test/models/mini_app_runtime_test.dart
          test/services/mini_app_directory_repository_test.dart
          test/services/mini_app_runtime_repository_test.dart

      - name: Test directory parsing and fallback
        run: >-
          flutter test
          test/models/mini_app_test.dart
          test/services/mini_app_directory_repository_test.dart
