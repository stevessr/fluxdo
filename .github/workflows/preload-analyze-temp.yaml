name: Preload Analyze Temp

on:
  push:
    branches:
      - feat/experimental-preload-cache

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/experimental-preload-cache
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - name: Prepare
        run: |
          mkdir -p assets/certs
          flutter pub get
      - name: Capture analyzer output
        shell: bash
        run: |
          set +e
          flutter analyze \
            lib/services/network/discourse_dio.dart \
            lib/services/network/interceptors/http_revalidation_interceptor.dart \
            lib/services/network/interceptors/request_coalescing_interceptor.dart \
            lib/services/network/interceptors/preload_cache_interceptor.dart \
            lib/services/preload_cache_service.dart \
            lib/providers/preload_cache_preferences.dart \
            lib/settings/definitions/custom_settings_defs.dart \
            test/services/network/interceptors/request_cache_interceptors_test.dart \
            test/services/network/interceptors/preload_cache_interceptor_test.dart \
            test/services/preload_cache_service_test.dart \
            > .ci-preload-analyze.txt 2>&1
          status=$?
          echo "exit_code=$status" >> .ci-preload-analyze.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-preload-analyze.txt
          git commit -m 'ci: capture preload analyzer output'
          git push origin HEAD:feat/experimental-preload-cache
