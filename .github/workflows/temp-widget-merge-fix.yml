name: Temporary final widget merge resolver

on:
  push:
    branches:
      - sync/upstream-20260905

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-20260905
          fetch-depth: 0
      - name: Apply guarded widget merge fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one marker, found {count}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} markers, found {count}: {old[:80]!r}')
              p.write_text(s.replace(old, new))

          def regex_once(path, pattern, replacement):
              p = Path(path)
              s = p.read_text()
              out, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one regex match, found {count}')
              p.write_text(out)

          # 1) Painted topic cards are the production path now; keep the middle-click
          # regression anchored to the actual rendered widget instead of stale TopicCard.
          path = 'test/widgets/topic/topic_item_builder_middle_click_test.dart'
          replace_once(path,
              "import 'package:fluxdo/widgets/topic/topic_card.dart';",
              "import 'package:fluxdo/widgets/topic/painted_topic_card.dart';")
          replace_once(path,
              'final topicCard = find.byType(TopicCard);',
              'final topicCard = find.byType(PaintedTopicCard);')

          # 2) A clipped quadrant has less angular room than the nominal 90-degree fan.
          # Cap each ring by its real chord spacing so overflow falls back to classic
          # instead of drawing overlapping 50px targets.
          path = 'lib/widgets/user/radial_account_quick_switcher.dart'
          replace_once(path,
              '    final overflowed = requiredAccountRingCount > maxAccountRingCount;',
              '    var overflowed = requiredAccountRingCount > maxAccountRingCount;')
          replace_once(path,
              '''      final accountCount = math.min(remaining, capacityForRing(ringIndex));\n      final ringAccounts = slotAccounts\n          .skip(accountOffset)\n          .take(accountCount)\n          .toList(growable: false);\n      final targetArc = accountArcFor(radius);''',
              '''      final targetArc = accountArcFor(radius);\n      final accountCount = math.min(\n        remaining,\n        _capacityForTargetArc(\n          radius: radius,\n          sweepAngle: targetArc.sweepAngle,\n          nodeSize: nodeSize,\n          preferredCapacity: capacityForRing(ringIndex),\n        ),\n      );\n      if (accountCount <= 0) continue;\n      final ringAccounts = slotAccounts\n          .skip(accountOffset)\n          .take(accountCount)\n          .toList(growable: false);''')
          replace_once(path,
              '''      accountOffset += accountCount;\n    }\n    final manageArc = accountArcFor(manageRadius);''',
              '''      accountOffset += accountCount;\n    }\n    overflowed = overflowed || accountOffset < slotAccounts.length;\n    final manageArc = accountArcFor(manageRadius);''')
          replace_once(path,
              '''  static List<double> _accountAngles({\n    required int count,''',
              '''  static int _capacityForTargetArc({\n    required double radius,\n    required double sweepAngle,\n    required double nodeSize,\n    required int preferredCapacity,\n  }) {\n    if (preferredCapacity <= 0 || radius <= 0.0) return 0;\n    if (preferredCapacity == 1 || sweepAngle <= 0.0) return 1;\n    final chordRatio = (nodeSize / (2.0 * radius)).clamp(0.0, 1.0);\n    final minimumAngle = 2.0 * math.asin(chordRatio.toDouble());\n    if (!minimumAngle.isFinite || minimumAngle <= 0.0) {\n      return preferredCapacity;\n    }\n    final geometricCapacity = 1 + (sweepAngle / minimumAngle).floor();\n    return math.min(preferredCapacity, math.max(1, geometricCapacity));\n  }\n\n  static List<double> _accountAngles({\n    required int count,''')

          # Shared chat attachment migration helper.
          attachment_pattern = r'''return GestureDetector\(\s*onTap: \(\) \{\s*ImageViewerPage\.open\(\s*context,\s*url,\s*galleryImages: thumbnailUrls,\s*initialIndex: idx,\s*enableShare: true,\s*\);\s*\},\s*child: ClipRRect\(\s*borderRadius: BorderRadius\.circular\(\s*8\s*,?\s*\),\s*child: CachedImage\(\s*url: url,\s*width: 180,\s*height: 120,\s*fit: BoxFit\.cover,\s*\),\s*\),\s*\);'''
          attachment_replacement = '''return ClipRRect(\n                                          borderRadius: BorderRadius.circular(8),\n                                          child: HeroImage(\n                                            heroTag: thumbnailHeroTags[idx],\n                                            style: thumbnailSourceStyle,\n                                            flightImage: discourseImageProvider(url),\n                                            onTap: () {\n                                              final viewerArgs =\n                                                  thumbnailSourceStyle.openViewerArgs;\n                                              ImageViewerPage.open(\n                                                context,\n                                                url,\n                                                heroTag: thumbnailHeroTags[idx],\n                                                galleryImages: thumbnailUrls,\n                                                heroTags: thumbnailHeroTags,\n                                                initialIndex: idx,\n                                                enableShare: true,\n                                                thumbnailUrl: url,\n                                                thumbnailUrls: thumbnailUrls,\n                                                heroSourceFit: viewerArgs.fit,\n                                                heroSourceRadius: viewerArgs.radius,\n                                                heroSourceCircular:\n                                                    viewerArgs.circular,\n                                              );\n                                            },\n                                            child: CachedImage(\n                                              url: url,\n                                              width: 180,\n                                              height: 120,\n                                              fit: BoxFit.cover,\n                                            ),\n                                          ),\n                                        );'''

          # 3) Main chat attachments: restore the HeroImage contract lost in the
          # chat refactor, with stable per-message gallery tags and source-style args.
          path = 'lib/pages/chat/chat_message_page.dart'
          replace_once(path,
              "import '../../services/preloaded_data_service.dart';",
              "import '../../services/preloaded_data_service.dart';\nimport '../../services/discourse_cache_manager.dart';")
          replace_once(path,
              "import '../../widgets/common/cached_image.dart';",
              "import '../../widgets/common/cached_image.dart';\nimport '../../widgets/common/hero_image.dart';")
          replace_once(path,
              '''    final thumbnailUrls = cookedHtml.isEmpty\n        ? imageUrls\n        : imageUrls.where((u) => !_cookedRendersUrl(cookedHtml, u)).toList();''',
              '''    final thumbnailUrls = cookedHtml.isEmpty\n        ? imageUrls\n        : imageUrls.where((u) => !_cookedRendersUrl(cookedHtml, u)).toList();\n    final thumbnailHeroTags = List<String>.generate(\n      thumbnailUrls.length,\n      (index) => 'chat_message_${message.id}_attachment_$index',\n    );\n    const thumbnailSourceStyle = ViewerSourceStyle.cover(radius: 8);''')
          regex_once(path, attachment_pattern, attachment_replacement)

          # 4) Thread attachments use a thread-scoped namespace so the sheet cannot
          # duplicate Hero tags with the underlying channel page.
          path = 'lib/pages/chat/chat_thread_sheet.dart'
          replace_once(path,
              "import '../../services/preloaded_data_service.dart';",
              "import '../../services/preloaded_data_service.dart';\nimport '../../services/discourse_cache_manager.dart';")
          replace_once(path,
              "import '../../widgets/common/cached_image.dart';",
              "import '../../widgets/common/cached_image.dart';\nimport '../../widgets/common/hero_image.dart';")
          replace_once(path,
              '''    final thumbnailUrls = cookedHtml.isEmpty\n        ? imageUrls\n        : imageUrls.where((u) => !_cookedRendersUrl(cookedHtml, u)).toList();''',
              '''    final thumbnailUrls = cookedHtml.isEmpty\n        ? imageUrls\n        : imageUrls.where((u) => !_cookedRendersUrl(cookedHtml, u)).toList();\n    final thumbnailHeroTags = List<String>.generate(\n      thumbnailUrls.length,\n      (index) =>\n          'chat_thread_${widget.thread.id}_${message.id}_attachment_$index',\n    );\n    const thumbnailSourceStyle = ViewerSourceStyle.cover(radius: 8);''')
          regex_once(path, attachment_pattern, attachment_replacement)

          # 5) The upstream profile shell moved the real avatar into the overview
          # implementation. Restore the unified HeroImage source and derive viewer
          # arguments from one ViewerSourceStyle instead of duplicated literals.
          path = 'lib/pages/user_profile_overview_page.dart'
          replace_once(path,
              "import '../widgets/common/smart_avatar.dart';",
              "import '../widgets/common/smart_avatar.dart';\nimport '../widgets/common/hero_image.dart';")
          replace_once(path,
              '''                                final isSquare = isSquareAvatarUrl(thumbUrl);\n                                ImageViewerPage.open(''',
              '''                                final isSquare = isSquareAvatarUrl(thumbUrl);\n                                final sourceStyle = isSquare\n                                    ? const ViewerSourceStyle.cover(radius: 8)\n                                    : const ViewerSourceStyle.circular();\n                                final viewerArgs = sourceStyle.openViewerArgs;\n                                ImageViewerPage.open(''')
          replace_once(path,
              '''                                  heroSourceCircular: !isSquare,\n                                  heroSourceRadius: isSquare ? 8 : 0,\n                                  heroSourceFit: isSquare ? BoxFit.cover : null,''',
              '''                                  heroSourceCircular: viewerArgs.circular,\n                                  heroSourceRadius: viewerArgs.radius,\n                                  heroSourceFit: viewerArgs.fit,''')
          replace_once(path,
              '''                                final isSquare = isSquareAvatarUrl(avatarUrl);\n                                return Container(''',
              '''                                final isSquare = isSquareAvatarUrl(avatarUrl);\n                                final sourceStyle = isSquare\n                                    ? const ViewerSourceStyle.cover(radius: 8)\n                                    : const ViewerSourceStyle.circular();\n                                return Container(''')
          replace_once(path,
              '''                                    avatar: Hero(\n                                      tag:\n                                          'user_avatar_${_user?.username ?? ''}',\n                                      child: SmartAvatar(''',
              '''                                    avatar: HeroImage(\n                                      heroTag:\n                                          'user_avatar_${_user?.username ?? ''}',\n                                      style: sourceStyle,\n                                      flightImage: avatarUrl == null\n                                          ? null\n                                          : discourseImageProvider(avatarUrl),\n                                      child: SmartAvatar(''')

          # 6) Coverage lists follow the current post-refactor source files.
          path = 'test/widgets/viewer_hero_rect_tween_coverage_test.dart'
          replace_count(path,
              "      'lib/pages/chat/channel/_chat_widgets.dart',",
              "      'lib/pages/chat/chat_message_page.dart',\n      'lib/pages/chat/chat_thread_sheet.dart',",
              2)
          replace_count(path,
              "      'lib/pages/user_profile_page.dart',",
              "      'lib/pages/user_profile_overview_page.dart',",
              2)
          replace_once(path,
              "  test('六处源端已全部迁到 HeroImage(不再裸用 Hero)', () {",
              "  test('当前查看器源端已全部迁到 HeroImage(不再裸用 Hero)', () {")

          PY
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/widgets/user/radial_account_quick_switcher.dart \
            lib/pages/chat/chat_message_page.dart \
            lib/pages/chat/chat_thread_sheet.dart \
            lib/pages/user_profile_overview_page.dart \
            test/widgets/topic/topic_item_builder_middle_click_test.dart \
            test/widgets/viewer_hero_rect_tween_coverage_test.dart
          git commit -m 'fix: resolve final upstream widget regressions'
          git rm .github/workflows/temp-widget-merge-fix.yml
          git commit -m 'ci: remove final widget merge resolver'
          git push origin HEAD:sync/upstream-20260905
