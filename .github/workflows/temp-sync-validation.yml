name: Temporary upstream sync validation

on:
  push:
    branches:
      - sync/upstream-20260905
  workflow_dispatch:

concurrency:
  group: upstream-sync-validation-thread-hero-20260905
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  merge-sensitive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - name: Run merge-sensitive regressions
        run: >-
          dart tool/flutterw.dart test
          test/models/topic_detail_private_message_participants_test.dart
          test/pages/topic_detail_page/private_message_participants_test.dart
          test/services/sticker_market_service_test.dart
          test/services/account_runtime_pool_test.dart
          test/services/shared_media_cache_policy_test.dart

  test-groups:
    name: test ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - test/models
          - test/modules
          - test/pages
          - test/perf
          - test/plugins
          - test/providers
          - test/services
          - test/settings
          - test/storage
          - test/utils
          - test/widgets
          - test/paragraph_isolate_spike_test.dart
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - name: Run ${{ matrix.target }}
        run: dart tool/flutterw.dart test ${{ matrix.target }}
