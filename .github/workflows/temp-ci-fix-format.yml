name: Temporary CI Fix Format

on:
  push:
    branches:
      - chore/format-all-temp
    paths:
      - '.github/workflows/temp-ci-fix-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Format CI target files
        run: |
          dart format \
            lib/services/preload_cache_service.dart \
            lib/utils/screenshot_utils.dart \
            packages/enhanced_cookie_jar/lib/src/enhanced_persist_cookie_jar.dart \
            packages/enhanced_cookie_jar/test/delete_cookie_identity_test.dart
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/temp-ci-fix-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "style: format CI target files"
          git push origin HEAD:${GITHUB_REF_NAME}
