name: Temporary Cookie CI Format

on:
  push:
    branches:
      - chore/format-all-temp
    paths:
      - '.github/workflows/temp-cookie-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format cookie package files
        run: |
          dart format \
            packages/enhanced_cookie_jar/lib/src/enhanced_persist_cookie_jar.dart \
            packages/enhanced_cookie_jar/test/delete_cookie_identity_test.dart
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/temp-cookie-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "style: format enhanced cookie jar"
          git push origin HEAD:${GITHUB_REF_NAME}
