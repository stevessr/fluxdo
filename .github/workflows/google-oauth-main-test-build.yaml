name: Google OAuth Main Test Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/google-oauth-main-test-build.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: '28.2.13676358'

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/doh_proxy
          key: oauth-google-main-android-arm64-${{ env.ANDROID_NDK_VERSION }}

      - name: Setup Android build environment
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          if ! command -v cargo-ndk >/dev/null 2>&1; then cargo install cargo-ndk; fi

      - name: Setup Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            ndk;${{ env.ANDROID_NDK_VERSION }}
            platforms;android-36
            platforms;android-31
            cmake;3.22.1
          log-accepted-android-sdk-licenses: false

      - name: Configure Android NDK path
        run: |
          set -euo pipefail
          ndk_path="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          test -d "${ndk_path}"
          echo "ANDROID_NDK_HOME=${ndk_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk_path}" >> "${GITHUB_ENV}"
          touch android/local.properties
          printf 'sdk.dir=%s\nndk.dir=%s\nflutter.ndkVersion=%s\n' "$ANDROID_HOME" "$ndk_path" "$ANDROID_NDK_VERSION" >> android/local.properties

      - name: Setup Android signing and Google services
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_PROPERTIES" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            echo "$KEY_PROPERTIES" > android/key.properties
            echo 'Using repository release signing key'
          else
            echo 'Release signing secrets unavailable; Gradle will use its configured debug fallback'
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else
            cat > android/app/google-services.json <<'EOF'
          {
            "project_info":{"project_number":"123456789012","project_id":"fluxdo-dummy","storage_bucket":"fluxdo-dummy.appspot.com"},
            "client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:0000000000000000","android_client_info":{"package_name":"com.github.lingyan000.fluxdo"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildWithoutSecrets0000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],
            "configuration_version":"1"
          }
          EOF
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Google OAuth integration
        run: >-
          flutter analyze --no-fatal-infos
          lib/services/google_oauth_login_flow.dart
          lib/services/deep_link_service.dart
          lib/pages/login_page.dart

      - name: Build Android arm64 APK
        run: |
          dart tool/flutterw.dart build apk --release --target-platform android-arm64 --dart-define=cronetHttpNoPlay=true --split-debug-info=build/symbols
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep 'lib/arm64-v8a/libdoh_proxy.so'
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-release.apk dist/fluxdo-google-oauth-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fluxdo-google-oauth-arm64
          path: dist/fluxdo-google-oauth-arm64.apk
          retention-days: 7
          if-no-files-found: error
