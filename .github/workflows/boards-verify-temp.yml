name: Temporary Boards Verify

on:
  push:
    branches:
      - feature/discourse-boards-support
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: mkdir -p assets/certs
      - run: flutter pub get
      - name: Format Boards
        run: |
          dart format lib/models/board.dart lib/pages/boards_page.dart lib/navigation/nav_action_bus.dart lib/navigation/nav_entry_registry.dart lib/services/deep_link_service.dart lib/services/discourse/discourse_service.dart lib/services/discourse/_boards.dart lib/utils/discourse_url_parser.dart lib/utils/link_launcher.dart test/models/board_test.dart test/utils/board_link_parser_test.dart
          git diff -- lib/models/board.dart lib/pages/boards_page.dart test/models/board_test.dart test/utils/board_link_parser_test.dart
      - name: Analyze Boards
        run: flutter analyze lib/models/board.dart lib/pages/boards_page.dart lib/navigation/nav_entry_registry.dart lib/services/deep_link_service.dart lib/services/discourse/discourse_service.dart lib/utils/discourse_url_parser.dart lib/utils/link_launcher.dart test/models/board_test.dart test/utils/board_link_parser_test.dart
      - name: Test Boards
        run: dart test test/models/board_test.dart test/utils/board_link_parser_test.dart
