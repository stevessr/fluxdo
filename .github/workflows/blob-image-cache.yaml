name: Blob Image Cache

on:
  pull_request:
    paths:
      - 'lib/services/blob_image_cache.dart'
      - 'lib/services/data_management/cache_size_service.dart'
      - 'lib/settings/definitions/data_management_defs.dart'
      - 'lib/widgets/settings/shared_cache_management_section.dart'
      - 'lib/l10n/modules/dataManagement/**'
      - 'test/services/blob_image_cache_test.dart'
      - '.github/workflows/blob-image-cache.yaml'
  push:
    branches:
      - main
    paths:
      - 'lib/services/blob_image_cache.dart'
      - 'lib/services/data_management/cache_size_service.dart'
      - 'lib/settings/definitions/data_management_defs.dart'
      - 'lib/widgets/settings/shared_cache_management_section.dart'
      - 'lib/l10n/modules/dataManagement/**'
      - 'test/services/blob_image_cache_test.dart'
      - '.github/workflows/blob-image-cache.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.head_ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Prepare generated asset directories
        run: mkdir -p assets/certs

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: dart run tool/gen_l10n.dart

      - name: Format cache path
        run: |
          dart format \
            lib/services/blob_image_cache.dart \
            lib/services/data_management/cache_size_service.dart \
            lib/settings/definitions/data_management_defs.dart \
            lib/widgets/settings/shared_cache_management_section.dart \
            test/services/blob_image_cache_test.dart
          if git diff --quiet -- \
            lib/services/blob_image_cache.dart \
            lib/services/data_management/cache_size_service.dart \
            lib/settings/definitions/data_management_defs.dart \
            lib/widgets/settings/shared_cache_management_section.dart \
            test/services/blob_image_cache_test.dart; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/services/blob_image_cache.dart \
            lib/services/data_management/cache_size_service.dart \
            lib/settings/definitions/data_management_defs.dart \
            lib/widgets/settings/shared_cache_management_section.dart \
            test/services/blob_image_cache_test.dart
          git commit -m 'style: format shared cache changes'
          git push origin HEAD:${{ github.head_ref }}

      - name: Analyze cache path
        run: >-
          flutter analyze
          lib/services/blob_image_cache.dart
          lib/services/data_management/cache_size_service.dart
          lib/settings/definitions/data_management_defs.dart
          lib/widgets/settings/shared_cache_management_section.dart
          test/services/blob_image_cache_test.dart

      - name: Test blob image cache contracts
        run: >-
          dart tool/flutterw.dart test
          test/services/blob_image_cache_test.dart
