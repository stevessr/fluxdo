name: Blob Image Cache

# Feature-specific regression suite: run on demand, not on every PR/push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Prepare generated asset directories
        run: mkdir -p assets/certs

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: dart run tool/gen_l10n.dart

      - name: Check cache path formatting (read-only)
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/services/blob_image_cache.dart \
            lib/services/data_management/cache_size_service.dart \
            lib/settings/definitions/data_management_defs.dart \
            lib/widgets/settings/shared_cache_management_section.dart \
            test/services/blob_image_cache_test.dart

      - name: Analyze cache path
        run: >-
          flutter analyze
          lib/services/blob_image_cache.dart
          lib/services/data_management/cache_size_service.dart
          lib/settings/definitions/data_management_defs.dart
          lib/widgets/settings/shared_cache_management_section.dart
          test/services/blob_image_cache_test.dart

      - name: Test blob image cache contracts
        run: >-
          dart tool/flutterw.dart test
          test/services/blob_image_cache_test.dart
