name: Temporary upstream PM conflict resolver

on:
  push:
    branches:
      - sync/upstream-20260905

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Merge private-message feature sets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Lingyan000/fluxdo.git || true
          git fetch upstream main
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def upstream(path):
              return subprocess.check_output(['git','show',f'upstream/main:{path}'], text=True)

          def method_block(text, marker):
              start = text.index(marker)
              brace = text.index('{', start)
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
              raise RuntimeError(marker)

          # 专用 PM 成员组件：上游实现是 fork 现有用户成员面板的严格超集
          # （用户 + 群组 + 邀请 + 用户卡片 + 正确的短私信底部门禁）。
          pm_widget = 'lib/pages/topic_detail_page/widgets/private_message_participants.dart'
          Path(pm_widget).write_text(upstream(pm_widget))

          # 用户操作：保留 fork 的回复收件人编辑，把群组转换为名称；
          # 成员操作块替换为上游扩展版本。
          path = 'lib/pages/topic_detail_page/actions/_user_actions.dart'
          p = Path(path); text = p.read_text(); up = upstream(path)
          text = text.replace('              ...detail.allowedGroups,\n', '              ...detail.allowedGroups.map((group) => group.name),\n')
          marker = '  Future<void> _handleRemovePrivateMessageParticipant('
          if marker in text:
              s, e = method_block(text, marker)
              # 当前 fork 旧块到 delete handler 之间没有别的独立功能；用上游 PM 超集替换。
              delete_marker = '  Future<void> _handleDeletePost('
              end_region = text.index(delete_marker, e)
              up_start = up.index(marker)
              up_end = up.index(delete_marker, up_start)
              text = text[:s] + up[up_start:up_end] + text[end_region:]
          p.write_text(text)

          # TopicDetailPage：保留 fork 的 currentUser 参数与其它页面状态，只补群组/邀请/归档状态和回调。
          path = 'lib/pages/topic_detail_page/topic_detail_page.dart'
          p = Path(path); text = p.read_text()
          if 'String? _removingPrivateMessageGroupName;' not in text:
              text = text.replace(
                  '  int? _removingPrivateMessageParticipantId;\n',
                  '  int? _removingPrivateMessageParticipantId;\n  String? _removingPrivateMessageGroupName;\n  bool _isTogglingArchiveMessage = false;\n', 1)
          callback_old = '''          removingPrivateMessageParticipantId:\n              _removingPrivateMessageParticipantId,\n          onRemovePrivateMessageParticipant: isLoggedIn\n              ? _handleRemovePrivateMessageParticipant\n              : null,\n'''
          callback_new = callback_old + '''          removingPrivateMessageGroupName: _removingPrivateMessageGroupName,\n          onRemovePrivateMessageGroup: isLoggedIn\n              ? _handleRemovePrivateMessageGroup\n              : null,\n          onInvitePrivateMessageParticipants: isLoggedIn\n              ? _handleInvitePrivateMessageParticipants\n              : null,\n'''
          # 两个调用点（NestedPostList / TopicPostList）都保留 fork 现有参数。
          if 'onRemovePrivateMessageGroup:' not in text:
              if text.count(callback_old) != 2:
                  raise SystemExit(f'unexpected PM callback occurrence count: {text.count(callback_old)}')
              text = text.replace(callback_old, callback_new)
          p.write_text(text)

          # 两种帖子列表：新增群组/邀请回调，保留 fork 的 currentUserId/admin 参数。
          for path in [
              'lib/pages/topic_detail_page/widgets/topic_post_list.dart',
              'lib/pages/topic_detail_page/widgets/nested_post_list.dart',
          ]:
              p = Path(path); text = p.read_text()
              if 'final String? removingPrivateMessageGroupName;' not in text:
                  text = text.replace(
                      '  final int? removingPrivateMessageParticipantId;\n  final ValueChanged<TopicUser>? onRemovePrivateMessageParticipant;\n',
                      '  final int? removingPrivateMessageParticipantId;\n  final String? removingPrivateMessageGroupName;\n  final ValueChanged<TopicUser>? onRemovePrivateMessageParticipant;\n  final ValueChanged<TopicGroup>? onRemovePrivateMessageGroup;\n  final VoidCallback? onInvitePrivateMessageParticipants;\n', 1)
              if 'this.removingPrivateMessageGroupName,' not in text:
                  text = text.replace(
                      '    this.removingPrivateMessageParticipantId,\n    this.onRemovePrivateMessageParticipant,\n',
                      '    this.removingPrivateMessageParticipantId,\n    this.removingPrivateMessageGroupName,\n    this.onRemovePrivateMessageParticipant,\n    this.onRemovePrivateMessageGroup,\n    this.onInvitePrivateMessageParticipants,\n', 1)
              helper_marker = '  PrivateMessageParticipants _buildPrivateMessageParticipants('
              if helper_marker in text and 'PrivateMessageParticipants.fromDetail(' not in text:
                  s, e = method_block(text, helper_marker)
                  replacement = '''  PrivateMessageParticipants _buildPrivateMessageParticipants(\n    PrivateMessageParticipantsLocation location,\n  ) {\n    return PrivateMessageParticipants.fromDetail(\n      location: location,\n      detail: ''' + ('detail' if path.endswith('topic_post_list.dart') else 'widget.detail') + ''',\n      removingParticipantId: widget.removingPrivateMessageParticipantId,\n      removingGroupName: widget.removingPrivateMessageGroupName,\n      onRemoveParticipant: widget.onRemovePrivateMessageParticipant,\n      onRemoveGroup: widget.onRemovePrivateMessageGroup,\n      onInvite: widget.onInvitePrivateMessageParticipants,\n    );\n  }'''
                  text = text[:s] + replacement + text[e:]
              if path.endswith('topic_post_list.dart'):
                  text = text.replace(
                      '        detail.isPrivateMessage &&\n            detail.allowedUsers.isNotEmpty &&\n',
                      '        PrivateMessageParticipants.shouldShow(detail) &&\n', 1)
              p.write_text(text)

          PY
          rm -f .github/workflows/temp-sync-resolve-pm.yml
          git add -A
          git commit -m "sync: merge upstream private-message enhancements"
          git push origin HEAD:sync/upstream-20260905
