name: Community Events Calendar

on:
  pull_request:
    paths:
      - 'lib/pages/community_events_page.dart'
      - 'lib/pages/community_events_calendar.dart'
      - 'test/pages/community_events_calendar_test.dart'
      - 'test/pages/community_events_page_test.dart'
      - '.github/workflows/community-events-calendar.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
      - 'packages/common_ui/**'
      - 'tool/gen_l10n.dart'
      - 'tool/flutterw.dart'
      - 'tool/project_prep.dart'
      - 'lib/l10n/**'
      - '.github/workflows/_check-scope.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scope:
    uses: ./.github/workflows/_check-scope.yml
    with:
      workflow_file: .github/workflows/community-events-calendar.yml
      patterns: >-
        ["lib/pages/community_events_page.dart","lib/pages/community_events_calendar.dart","test/pages/community_events_calendar_test.dart","test/pages/community_events_page_test.dart",".github/workflows/community-events-calendar.yml","pubspec.yaml","pubspec.lock",".fvmrc","packages/common_ui/**","tool/gen_l10n.dart","tool/flutterw.dart","tool/project_prep.dart","lib/l10n/**",".github/workflows/_check-scope.yml"]

  verify:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - name: Install Flutter Linux native hook dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Prepare assets
        run: mkdir -p assets/certs

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization code
        run: dart run tool/gen_l10n.dart

      - name: Format calendar implementation
        run: dart format lib/pages/community_events_page.dart lib/pages/community_events_calendar.dart test/pages/community_events_calendar_test.dart test/pages/community_events_page_test.dart

      - name: Analyze calendar implementation
        run: flutter analyze --no-pub --no-fatal-infos lib/pages/community_events_page.dart lib/pages/community_events_calendar.dart test/pages/community_events_calendar_test.dart test/pages/community_events_page_test.dart

      - name: Test calendar behavior
        run: dart tool/flutterw.dart test test/pages/community_events_calendar_test.dart test/pages/community_events_page_test.dart
