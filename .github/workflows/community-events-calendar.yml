name: Community Events Calendar

on:
  pull_request:
    paths:
      - 'lib/pages/community_events_page.dart'
      - 'lib/pages/community_events_calendar.dart'
      - 'test/pages/community_events_calendar_test.dart'
      - '.github/workflows/community-events-calendar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Prepare assets
        run: mkdir -p assets/certs

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization code
        run: dart run tool/gen_l10n.dart

      - name: Format calendar implementation
        run: dart format lib/pages/community_events_page.dart lib/pages/community_events_calendar.dart test/pages/community_events_calendar_test.dart

      - name: Analyze calendar implementation
        run: flutter analyze --no-pub lib/pages/community_events_page.dart lib/pages/community_events_calendar.dart test/pages/community_events_calendar_test.dart

      - name: Test calendar behavior
        run: dart tool/flutterw.dart test test/pages/community_events_calendar_test.dart
