name: System Browser Auth

on:
  pull_request:
    paths:
      - 'lib/services/system_browser_service.dart'
      - 'android/app/src/main/kotlin/com/github/lingyan000/fluxdo/MainActivity.kt'
      - 'test/services/system_browser_service_test.dart'
      - '.github/workflows/system-browser-auth.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dart-browser-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Prepare generated directories
        run: mkdir -p assets/certs assets/images/llm
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localization
        run: dart run tool/gen_l10n.dart
      - name: Analyze browser discovery
        run: flutter analyze lib/services/system_browser_service.dart test/services/system_browser_service_test.dart
      - name: Test browser discovery and authorization URL guard
        run: dart tool/flutterw.dart test test/services/system_browser_service_test.dart
