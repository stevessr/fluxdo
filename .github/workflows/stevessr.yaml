name: StevesSR Generator Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches:
      - main
    paths:
      - 'packages/stevessr_generator/**'
      - 'packages/common_ui/**'
      - 'packages/app_icons/**'
      - '.fvmrc'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/stevessr.yaml'
      - '.github/actions/build-stevessr/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stevessr-generator-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changes since previous nightly
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A missing or different APK in either release must be repaired.
          asset_digest() {
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$1" \
              --jq '.assets[] | select(.name == "stevessr-generator-android-arm64-v8a.apk" and .state == "uploaded") | .digest // empty'
          }
          standalone_digest="$(asset_digest stevessr-nightly || true)"
          shared_digest="$(asset_digest nightly || true)"
          if [[ ! "$standalone_digest" =~ ^sha256:[0-9a-f]{64}$ || "$standalone_digest" != "$shared_digest" ]]; then
            echo "Generator APK missing, unverifiable or inconsistent between releases; rebuilding."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_tag="stevessr-nightly"
          if ! previous_commit="$(git rev-parse --verify "refs/tags/${previous_tag}^{commit}" 2>/dev/null)"; then
            echo "No previous nightly tag; building initial APK."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$previous_commit" HEAD -- packages/stevessr_generator/ packages/common_ui/ packages/app_icons/ .fvmrc pubspec.yaml pubspec.lock .github/workflows/stevessr.yaml .github/actions/build-stevessr/; then
            echo "No package changes since ${previous_tag}; skipping build and upload."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Package changes found since ${previous_tag}."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: detect-changes
    if: needs.detect-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and validate release APK
        uses: ./.github/actions/build-stevessr

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stevessr-generator-android-arm64-v8a
          path: stevessr-generator-android-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

  publish-nightly:
    name: Publish generator APK to nightly
    needs: build-and-release
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # 与主程序发布共用并发组，只在上传附件期间串行。
    concurrency:
      group: fluxdo-nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download generator APK
        uses: actions/download-artifact@v4
        with:
          name: stevessr-generator-android-arm64-v8a
          path: nightly

      - name: Create or update nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stevessr-nightly
          target_commitish: ${{ github.sha }}
          name: StevesSR Generator Nightly
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: nightly/stevessr-generator-android-arm64-v8a.apk
          body: |
            Automated nightly build of the FluxDO external StevesSR Generator plugin APK.

            Source commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload generator APK to shared nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 首次发布时创建入口；已有主程序发布说明和标签由主程序工作流维护。
          if ! gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create nightly --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Fluxdo Nightly" \
              --prerelease --latest=false \
              --notes "Automated nightly Android APKs for FluxDO and standalone components."
          fi
          gh release upload nightly nightly/stevessr-generator-android-arm64-v8a.apk \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify both published APKs and advance nightly tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=nightly/stevessr-generator-android-arm64-v8a.apk
          expected="sha256:$(sha256sum "$apk" | cut -d ' ' -f 1)"
          for tag in stevessr-nightly nightly; do
            actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              --jq '.assets[] | select(.name == "stevessr-generator-android-arm64-v8a.apk" and .state == "uploaded") | .digest // empty')"
            if [[ "$actual" != "$expected" ]]; then
              echo "APK digest mismatch for $tag"
              exit 1
            fi
          done
          git tag -f stevessr-nightly "$GITHUB_SHA"
          git push --force origin refs/tags/stevessr-nightly
