name: Android External Plugin Contract

on:
  pull_request:
    paths:
      - 'packages/stevessr_generator/example/android/**'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/kotlin/**'
      - 'lib/services/external_plugin_service.dart'
      - 'lib/widgets/markdown_editor/markdown_editor.dart'
      - 'lib/widgets/markdown_editor/rich_composer/rich_composer_editor.dart'
      - 'lib/pages/chat/chat_message_page.dart'
      - 'lib/pages/chat/chat_thread_sheet.dart'
      - 'packages/stevessr_generator/**'
      - 'packages/stevessr_generator/lib/src/pages/stevessr_generator_page.dart'
      - 'lib/pages/installed_plugins_page.dart'
      - 'lib/widgets/markdown_editor/emoji_sticker_panel.dart'
      - 'test/services/external_plugin_service_test.dart'
      - 'scripts/check_external_plugin_contract.py'
      - '.github/workflows/external-plugin-contract.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
      - 'packages/common_ui/**'
      - 'tool/gen_l10n.dart'
      - 'tool/flutterw.dart'
      - 'tool/project_prep.dart'
      - 'lib/l10n/**'
      - '.github/workflows/_check-scope.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scope:
    uses: ./.github/workflows/_check-scope.yml
    with:
      workflow_file: .github/workflows/external-plugin-contract.yml
      patterns: >-
        ["packages/stevessr_generator/example/android/**","android/app/src/main/AndroidManifest.xml","android/app/src/main/kotlin/**","lib/services/external_plugin_service.dart","lib/widgets/markdown_editor/markdown_editor.dart","lib/widgets/markdown_editor/rich_composer/rich_composer_editor.dart","lib/pages/chat/chat_message_page.dart","lib/pages/chat/chat_thread_sheet.dart","packages/stevessr_generator/**","packages/stevessr_generator/lib/src/pages/stevessr_generator_page.dart","lib/pages/installed_plugins_page.dart","lib/widgets/markdown_editor/emoji_sticker_panel.dart","test/services/external_plugin_service_test.dart","scripts/check_external_plugin_contract.py",".github/workflows/external-plugin-contract.yml","pubspec.yaml","pubspec.lock",".fvmrc","packages/common_ui/**","tool/gen_l10n.dart","tool/flutterw.dart","tool/project_prep.dart","lib/l10n/**",".github/workflows/_check-scope.yml"]

  contract:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查插件注册和桌面图标
        run: python3 scripts/check_external_plugin_contract.py

  flutter-plugin:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    name: Flutter plugin discovery and editor checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - name: Install Flutter Linux native hook dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
      - name: Prepare Flutter workspace
        run: |
          mkdir -p assets/certs assets/images/llm
          flutter pub get
          dart run tool/gen_l10n.dart
      - name: Analyze plugin UI and service
        run: >-
          flutter analyze --no-fatal-infos
          lib/services/external_plugin_service.dart
          lib/pages/installed_plugins_page.dart
          lib/pages/settings_page.dart
          lib/widgets/markdown_editor/emoji_sticker_panel.dart
          lib/widgets/markdown_editor/markdown_editor.dart
          lib/widgets/markdown_editor/rich_composer/rich_composer_editor.dart
          lib/pages/chat/chat_message_page.dart
          lib/pages/chat/chat_thread_sheet.dart
          test/services/external_plugin_service_test.dart
      - name: Test native channel adapter
        run: flutter test test/services/external_plugin_service_test.dart

  generator-apk:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    name: Build standalone generator plugin APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - name: Resolve generator dependencies
        working-directory: packages/stevessr_generator/example
        run: flutter pub get
      - name: Analyze generator entry point
        working-directory: packages/stevessr_generator/example
        run: flutter analyze --no-fatal-infos lib/main.dart
      - name: Test plugin appearance and generator page
        working-directory: packages/stevessr_generator/example
        run: flutter test test/plugin_theme_test.dart test/generator_page_test.dart
      - name: Compile standalone plugin APK
        working-directory: packages/stevessr_generator/example
        run: flutter build apk --debug --target-platform android-arm64
