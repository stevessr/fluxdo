name: Apply Matrix media transport optimization

on:
  push:
    branches:
      - feat/experimental-matrix-telegram
    paths:
      - '.github/workflows/experimental-matrix-media-transport-perf.yaml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/experimental-matrix-telegram
          fetch-depth: 0

      - name: Apply media transport optimization
        run: python3 tool/experimental_matrix_media_transport_perf.py

      - name: Validate patch
        run: |
          git diff --check
          git diff -- lib/services/messaging/matrix_media_service.dart

      - name: Commit media transport optimization
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/messaging/matrix_media_service.dart
          git commit -m 'perf(matrix): coalesce and cache media previews'
          git push origin HEAD:feat/experimental-matrix-telegram
