name: Validate continuation rich sync

on:
  push:
    branches: ["fix/composer-continuation-rich-sync"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/composer-continuation-rich-sync
          fetch-depth: 0
          submodules: recursive

      - name: Apply scoped patch
        run: python3 .github/scripts/apply_continuation_rich_sync.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localization
        run: dart run tool/gen_l10n.dart

      - name: Format reply composer
        run: dart format lib/widgets/post/reply_sheet.dart

      - name: Analyze reply composer
        run: flutter analyze lib/widgets/post/reply_sheet.dart

      - name: Validate and finalize branch
        shell: bash
        run: |
          git diff --check
          grep -q '_replaceComposerContent' lib/widgets/post/reply_sheet.dart
          grep -q 'content.contains(prefix)' lib/widgets/post/reply_sheet.dart
          rm .github/scripts/apply_continuation_rich_sync.py
          rm .github/workflows/apply-continuation-rich-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/widgets/post/reply_sheet.dart .github
          git diff --cached --check
          git commit -m "fix(composer): preserve continuation links in rich mode"
          git push origin HEAD:fix/composer-continuation-rich-sync
