name: Notification Navigation and Reactions

on:
  pull_request:
    paths:
      - 'lib/navigation/nav_entry_registry.dart'
      - 'lib/models/notification.dart'
      - 'lib/pages/notifications_page.dart'
      - 'lib/providers/selected_topic_provider.dart'
      - 'lib/utils/notification_navigation.dart'
      - 'lib/widgets/common/notification_icon_button.dart'
      - 'lib/l10n/modules/notification/**'
      - 'test/models/notification_reaction_aggregation_test.dart'
      - 'test/providers/selected_topic_provider_test.dart'
      - '.github/workflows/notification-navigation-check.yml'

permissions:
  contents: read

concurrency:
  group: notification-nav-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Prepare generated assets
        run: mkdir -p assets/certs assets/images/llm
      - name: Resolve dependencies and generate localizations
        run: |
          flutter pub get
          dart run tool/gen_l10n.dart
      - name: Analyze navigation and reactions
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/navigation/nav_entry_registry.dart \
            lib/models/notification.dart \
            lib/pages/notifications_page.dart \
            lib/providers/selected_topic_provider.dart \
            lib/utils/notification_navigation.dart \
            lib/widgets/common/notification_icon_button.dart \
            test/models/notification_reaction_aggregation_test.dart \
            test/providers/selected_topic_provider_test.dart
      - name: Run reaction and tab regressions
        run: |
          flutter test \
            test/models/notification_reaction_aggregation_test.dart \
            test/utils/notification_post_target_test.dart \
            test/models/notification_category_test.dart \
            test/providers/selected_topic_provider_test.dart
