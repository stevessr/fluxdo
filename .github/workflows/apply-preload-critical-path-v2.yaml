name: Apply preload critical-path v2

on:
  push:
    branches:
      - perf/preload-critical-path-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Apply patch
        run: python3 .github/scripts/apply_preload_critical_path_v2.py
      - name: Prepare and validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/certs
          dart format \
            lib/services/browser_trust_coordinator.dart \
            lib/services/preloaded_data_service.dart \
            test/services/browser_trust_preload_latency_contract_test.dart \
            test/services/preloaded_data_progress_test.dart
          git diff --check
          flutter pub get
          flutter analyze \
            lib/services/browser_trust_coordinator.dart \
            lib/services/preloaded_data_service.dart \
            test/services/browser_trust_preload_latency_contract_test.dart \
            test/services/preloaded_data_progress_test.dart
          dart tool/flutterw.dart test \
            test/services/browser_trust_preload_latency_contract_test.dart \
            test/services/preloaded_data_progress_test.dart
      - name: Commit implementation only
        shell: bash
        run: |
          set -euo pipefail
          git add \
            lib/services/browser_trust_coordinator.dart \
            lib/services/preloaded_data_service.dart \
            test/services/browser_trust_preload_latency_contract_test.dart \
            test/services/preloaded_data_progress_test.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(preload): overlap hydration and trim scan overhead'
          git push origin HEAD:perf/preload-critical-path-v2
