name: Preload Startup Latency

on:
  pull_request:
    paths:
      - 'lib/services/browser_trust_coordinator.dart'
      - 'lib/services/preloaded_data_service.dart'
      - 'lib/providers/topic_list/topic_list_provider.dart'
      - 'lib/pages/topics_screen.dart'
      - 'lib/widgets/preheat_gate.dart'
      - 'test/services/browser_trust_preload_latency_contract_test.dart'
      - 'test/services/preloaded_data_progress_test.dart'
      - '.github/workflows/preload-startup.yaml'
  push:
    branches:
      - main
      - fix/preload-startup-latency
    paths:
      - 'lib/services/browser_trust_coordinator.dart'
      - 'lib/services/preloaded_data_service.dart'
      - 'lib/providers/topic_list/topic_list_provider.dart'
      - 'lib/pages/topics_screen.dart'
      - 'lib/widgets/preheat_gate.dart'
      - 'test/services/browser_trust_preload_latency_contract_test.dart'
      - 'test/services/preloaded_data_progress_test.dart'
      - '.github/workflows/preload-startup.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preload-startup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Prepare generated asset directories
        run: mkdir -p assets/certs

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        id: format
        continue-on-error: true
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/services/browser_trust_coordinator.dart
          lib/services/preloaded_data_service.dart
          lib/providers/topic_list/topic_list_provider.dart
          lib/pages/topics_screen.dart
          lib/widgets/preheat_gate.dart
          test/services/browser_trust_preload_latency_contract_test.dart
          test/services/preloaded_data_progress_test.dart

      - name: Analyze preload startup path
        id: analyze
        continue-on-error: true
        run: >-
          flutter analyze
          lib/services/browser_trust_coordinator.dart
          lib/services/preloaded_data_service.dart
          lib/providers/topic_list/topic_list_provider.dart
          lib/pages/topics_screen.dart
          lib/widgets/preheat_gate.dart
          test/services/browser_trust_preload_latency_contract_test.dart
          test/services/preloaded_data_progress_test.dart

      - name: Test preload latency and progress contracts
        id: test
        continue-on-error: true
        run: >-
          dart tool/flutterw.dart test
          test/services/browser_trust_preload_latency_contract_test.dart
          test/services/preloaded_data_progress_test.dart

      - name: Enforce quality gates
        if: always()
        shell: bash
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          failed=0
          for gate in FORMAT ANALYZE TEST; do
            value_name="${gate}_OUTCOME"
            value="${!value_name}"
            if [[ "$value" != "success" ]]; then
              echo "::error::$gate gate failed: $value"
              failed=1
            fi
          done
          exit "$failed"
