name: Temporary bookmark final resolver

on:
  push:
    branches:
      - sync/upstream-20260905

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-20260905
          fetch-depth: 0
      - name: Apply bookmark fixes
        run: python3 .github/scripts/temp_bookmark_fix.py
      - name: Commit fixes and remove resolver
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/pages/bookmarks_page.dart \
            lib/widgets/topic/painted_topic_card.dart \
            test/pages/bookmarks/bookmarks_list_content_test.dart \
            test/pages/bookmarks/bookmarks_page_test.dart
          git commit -m 'fix: finalize bookmark lifecycle and painted semantics'
          git rm .github/workflows/temp-bookmark-final-fix.yml .github/scripts/temp_bookmark_fix.py
          git commit -m 'ci: remove bookmark final resolver'
          git push origin HEAD:sync/upstream-20260905
