name: Format preload pipeline

on:
  push:
    branches:
      - perf/preload-pipeline-progress

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/preload-pipeline-progress
          fetch-depth: 0
      - name: Apply formatter output
        run: python3 .github/scripts/format_preload_patch.py
      - name: Validate patch
        run: git diff --check
      - name: Commit formatting
        shell: bash
        run: |
          rm .github/scripts/format_preload_patch.py
          rm .github/workflows/format-preload-pipeline.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style(preload): apply dart formatting"
          git push origin HEAD:perf/preload-pipeline-progress
