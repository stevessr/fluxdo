name: NSH reader unit tests

on:
  push:
    branches:
      - migration/nsh-full-ui
    paths:
      - 'nsh/**'
      - '.github/workflows/nsh-reader-tests.yml'
  pull_request:
    paths:
      - 'nsh/**'
      - '.github/workflows/nsh-reader-tests.yml'
  workflow_dispatch:

concurrency:
  group: nsh-reader-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Type-check portable data layer
        run: |
          npx --yes --package typescript@5.8.3 tsc \
            --noEmit --strict --module esnext --moduleResolution bundler \
            --target es2023 --lib es2023,dom nsh/data.ts nsh/request_gate.ts nsh/host_protocol.ts
      - name: Test public reader and concurrency guard
        run: node --experimental-strip-types --test nsh/tests/*.test.mjs
