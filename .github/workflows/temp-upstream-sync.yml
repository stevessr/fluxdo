name: Temporary upstream sync

on:
  push:
    branches:
      - sync/upstream-20260905

permissions:
  contents: write

jobs:
  merge-upstream:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Merge upstream conservatively
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Lingyan000/fluxdo.git
          git fetch upstream main

          set +e
          git merge --no-ff --no-commit upstream/main
          merge_status=$?
          set -e

          conflicts_file="UPSTREAM_SYNC_CONFLICTS.txt"
          : > "$conflicts_file"
          if [ "$merge_status" -ne 0 ]; then
            git diff --name-only --diff-filter=U | tee "$conflicts_file"
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              git checkout --ours -- "$path"
              git add -- "$path"
            done < "$conflicts_file"
          fi

          rm -f .github/workflows/temp-upstream-sync.yml
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "merge: sync upstream Lingyan000/fluxdo main (conflicts preserved as ours)"
          git push origin HEAD:sync/upstream-20260905
