name: Apply composer IME and Discourse action fix

on:
  push:
    branches:
      - fix/composer-ime-discourse-actions

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Apply targeted source patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tool/apply_composer_fix.py')
          text = p.read_text()
          old = """    if count != 1:\n        raise SystemExit(f\"{label}: expected exactly one match, got {count}\")\n    p.write_text(text.replace(old, new, 1))"""
          new = """    if count < 1:\n        raise SystemExit(f\"{label}: expected at least one match, got {count}\")\n    p.write_text(text.replace(old, new, 1))"""
          if old not in text:
              raise SystemExit('replace_once guard not found')
          p.write_text(text.replace(old, new, 1))
          PY
          python3 tool/apply_composer_fix.py

      - name: Install dependencies and generate localization
        run: |
          flutter pub get
          dart run tool/gen_l10n.dart

      - name: Format changed Dart files
        run: |
          dart format \
            lib/widgets/markdown_editor/markdown_editor.dart \
            lib/widgets/post/reply_sheet.dart \
            lib/models/topic.dart \
            lib/pages/topic_detail_page/actions/_user_actions.dart

      - name: Analyze changed source files
        run: |
          dart analyze lib/widgets/markdown_editor/markdown_editor.dart
          dart analyze lib/widgets/post/reply_sheet.dart
          dart analyze lib/models/topic.dart
          dart analyze lib/pages/topic_detail_page/actions/_user_actions.dart

      - name: Commit source fix and remove one-shot files
        if: success()
        run: |
          git rm .github/workflows/apply-composer-fix.yml tool/apply_composer_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: improve composer IME and Discourse reply actions'
          git push origin HEAD:fix/composer-ime-discourse-actions
