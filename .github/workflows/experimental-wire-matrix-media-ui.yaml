name: Wire Matrix media UI once

on:
  push:
    branches:
      - feat/experimental-matrix-telegram
    paths:
      - '.github/workflows/experimental-wire-matrix-media-ui.yaml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/experimental-matrix-telegram
          fetch-depth: 0

      - name: Patch Matrix room composer
        run: python3 tool/experimental_wire_matrix_media_ui.py

      - name: Validate and commit
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/chat/matrix_room_page.dart
          git commit -m 'feat(matrix): wire unencrypted media upload into composer'
          git push origin HEAD:feat/experimental-matrix-telegram
