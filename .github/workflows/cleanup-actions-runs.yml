name: Daily Actions run cleanup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview deletions without changing run history'
        type: boolean
        required: true
        default: true
      active_days:
        description: 'Keep runs of existing workflows for at least this many days'
        type: number
        required: true
        default: 30
      orphan_days:
        description: 'Keep runs of deleted workflow YAML files for at least this many days'
        type: number
        required: true
        default: 3
      max_deletes:
        description: 'Maximum runs to inspect for deletion per invocation'
        type: number
        required: true
        default: 400

permissions:
  actions: write
  contents: read

concurrency:
  group: daily-actions-run-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run cleanup unit tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_cleanup_actions_runs.py' -v

      - name: Remove eligible old workflow runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          ACTIVE_DAYS: ${{ inputs.active_days || 30 }}
          ORPHAN_DAYS: ${{ inputs.orphan_days || 3 }}
          MAX_DELETES: ${{ inputs.max_deletes || 400 }}
        run: |
          set -euo pipefail
          flags=(
            --active-days "$ACTIVE_DAYS"
            --orphan-days "$ORPHAN_DAYS"
            --max-deletes "$MAX_DELETES"
          )
          if [[ "$DRY_RUN" == "true" ]]; then
            flags+=(--dry-run)
          fi
          python3 .github/scripts/cleanup_actions_runs.py "${flags[@]}"
