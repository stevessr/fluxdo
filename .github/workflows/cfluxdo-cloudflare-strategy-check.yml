name: Cloudflare Strategy Port

on:
  pull_request:
    paths:
      - 'lib/constants.dart'
      - 'lib/services/network/client_hints.dart'
      - 'test/services/network/client_hints_test.dart'
      - 'lib/services/cf_challenge_service.dart'
      - 'lib/services/network/cf/**'
      - 'lib/services/network/interceptors/**'
      - 'lib/services/network/recovery/policies.dart'
      - 'lib/services/network/discourse_dio.dart'
      - 'test/accept_language_test.dart'
      - 'test/services/network/recovery/recovery_test.dart'
      - '.github/workflows/cfluxdo-cloudflare-strategy-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - name: Install Flutter Linux native hook dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libx11-dev libxi-dev
      - run: mkdir -p assets/certs assets/images/llm
      - run: flutter pub get
      - run: dart run tool/gen_l10n.dart
      - name: Analyze changed code
        run: flutter analyze lib/constants.dart lib/services/cf_challenge_service.dart lib/services/network/cf/cf_challenge_classifier.dart lib/services/network/interceptors/cf_challenge_interceptor.dart lib/services/network/interceptors/request_header_interceptor.dart lib/services/network/recovery/policies.dart lib/services/network/discourse_dio.dart lib/services/network/client_hints.dart test/services/network/client_hints_test.dart test/accept_language_test.dart test/services/network/cf/cf_challenge_classifier_test.dart test/services/network/recovery/recovery_test.dart
      - name: Run targeted regressions
        run: dart tool/flutterw.dart test test/services/network/client_hints_test.dart test/accept_language_test.dart test/services/network/cf/cf_challenge_classifier_test.dart test/services/network/recovery/recovery_test.dart test/services/network/interceptors/cf_challenge_interceptor_test.dart
