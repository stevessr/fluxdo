name: Apply category drawer more navigation patch

on:
  push:
    branches: [feat/category-drawer-more]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/widgets/topic/category_drawer.dart')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import '../../models/tag_search_result.dart';\n",
              "import '../../models/tag_search_result.dart';\n"
              "import '../../navigation/nav_entry.dart';\n"
              "import '../../navigation/nav_entry_registry.dart';\n",
              'imports',
          )

          marker = 'class CategoryDrawer extends ConsumerStatefulWidget {'
          replace_once(
              marker,
              "enum _DrawerSection { categories, tags, more }\n\n"
              "String _drawerMoreLabel(BuildContext context) =>\n"
              "    Localizations.localeOf(context).languageCode == 'zh'\n"
              "        ? '\\u66f4\\u591a'\n"
              "        : 'More';\n\n"
              + marker,
              'section enum',
          )

          token = '  bool _showTags = false;\n'
          idx = text.find(token)
          if idx < 0:
              raise SystemExit('state token not found')
          prev_start = text.rfind('\n', 0, idx - 1) + 1
          prev_line = text[prev_start:idx]
          if not prev_line.lstrip().startswith('///'):
              raise SystemExit('unexpected state comment layout')
          state = (
              "  /// Current drawer section.\n"
              "  _DrawerSection _section = _DrawerSection.categories;\n\n"
              "  static const List<String> _moreEntryIds = [\n"
              "    'chat',\n"
              "    'messages',\n"
              "    'ai_bot',\n"
              "    'leaderboard',\n"
              "    'groups',\n"
              "    'upcoming_events',\n"
              "  ];\n"
          )
          text = text[:prev_start] + state + text[idx + len(token):]

          replace_once(
              "                  _DrawerTabSwitcher(\n"
              "                    showTags: _showTags,\n"
              "                    onChanged: (v) => setState(() => _showTags = v),\n"
              "                  ),\n"
              "                  const Spacer(),\n"
              "                  if (!_showTags && pinnedIds.isNotEmpty)\n",
              "                  Expanded(\n"
              "                    child: _DrawerTabSwitcher(\n"
              "                      section: _section,\n"
              "                      onChanged: (section) =>\n"
              "                          setState(() => _section = section),\n"
              "                    ),\n"
              "                  ),\n"
              "                  if (_section == _DrawerSection.categories &&\n"
              "                      pinnedIds.isNotEmpty)\n",
              'header switcher',
          )

          replace_once(
              "            Expanded(\n"
              "              child: _showTags\n"
              "                  ? _buildTagsList()\n"
              "                  : _buildCategoriesList(categoriesAsync, pinnedIds, levelFor),\n"
              "            ),\n",
              "            Expanded(\n"
              "              child: switch (_section) {\n"
              "                _DrawerSection.categories => _buildCategoriesList(\n"
              "                  categoriesAsync,\n"
              "                  pinnedIds,\n"
              "                  levelFor,\n"
              "                ),\n"
              "                _DrawerSection.tags => _buildTagsList(),\n"
              "                _DrawerSection.more => _buildMoreList(isLoggedIn),\n"
              "              },\n"
              "            ),\n",
              'drawer body',
          )

          method_marker = '  Widget _buildCategoriesList(\n'
          method_idx = text.find(method_marker)
          if method_idx < 0:
              raise SystemExit('categories method not found')
          insert_at = text.rfind('\n', 0, method_idx - 1) + 1
          if not text[insert_at:method_idx].lstrip().startswith('///'):
              insert_at = method_idx
          more_method = """  /// App-level destinations exposed from the category drawer.
          Widget _buildMoreList(bool isLoggedIn) {
            final entries = _moreEntryIds
                .map(NavEntryRegistry.byId)
                .whereType<NavEntry>()
                .where((entry) => !entry.requiresLogin || isLoggedIn)
                .toList(growable: false);

            return ListView(
              padding: const EdgeInsets.fromLTRB(12, 4, 12, 24),
              children: [
                for (final entry in entries)
                  _MoreNavRow(
                    icon: entry.iconData,
                    label: entry.label(context),
                    onTap: () {
                      final pageBuilder = entry.pageBuilder;
                      if (pageBuilder == null) return;
                      _closeAndPush(pageBuilder(context, true));
                    },
                  ),
              ],
            );
          }

          """
          text = text[:insert_at] + more_method + text[insert_at:]

          class_start = text.find('class _DrawerTabSwitcher extends StatelessWidget {')
          if class_start < 0:
              raise SystemExit('switcher class not found')
          replace_start = class_start
          comment_start = text.rfind('\n///', 0, class_start)
          if comment_start >= 0 and class_start - comment_start < 300:
              replace_start = comment_start + 1
              while True:
                  prior = text.rfind('\n///', 0, replace_start - 1)
                  if prior < 0 or replace_start - (prior + 1) >= 300:
                      break
                  replace_start = prior + 1

          brace = text.find('{', class_start)
          depth = 0
          class_end = None
          for pos in range(brace, len(text)):
              ch = text[pos]
              if ch == '{':
                  depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0:
                      class_end = pos + 1
                      break
          if class_end is None:
              raise SystemExit('switcher class end not found')

          replacement = r'''class _MoreNavRow extends StatelessWidget {
            const _MoreNavRow({
              required this.icon,
              required this.label,
              required this.onTap,
            });

            final IconData icon;
            final String label;
            final VoidCallback onTap;

            @override
            Widget build(BuildContext context) {
              final colorScheme = Theme.of(context).colorScheme;
              return Padding(
                padding: const EdgeInsets.only(bottom: 2),
                child: Material(
                  color: Colors.transparent,
                  borderRadius: BorderRadius.circular(14),
                  clipBehavior: Clip.antiAlias,
                  child: InkWell(
                    onTap: onTap,
                    child: Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 10),
                      child: SizedBox(
                        height: 48,
                        child: Row(
                          children: [
                            Container(
                              width: 32,
                              height: 32,
                              decoration: BoxDecoration(
                                color: colorScheme.primaryContainer.withValues(
                                  alpha: 0.65,
                                ),
                                borderRadius: BorderRadius.circular(9),
                              ),
                              child: Icon(
                                icon,
                                size: 18,
                                color: colorScheme.onPrimaryContainer,
                              ),
                            ),
                            const SizedBox(width: 12),
                            Expanded(
                              child: Text(
                                label,
                                maxLines: 1,
                                overflow: TextOverflow.ellipsis,
                                style: TextStyle(
                                  fontSize: 14.5,
                                  color: colorScheme.onSurface,
                                ),
                              ),
                            ),
                            const SizedBox(width: 8),
                            Icon(
                              Symbols.chevron_right_rounded,
                              size: 20,
                              color: colorScheme.onSurfaceVariant,
                            ),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          /// Three-way drawer switcher: categories / tags / more.
          class _DrawerTabSwitcher extends StatelessWidget {
            const _DrawerTabSwitcher({
              required this.section,
              required this.onChanged,
            });

            final _DrawerSection section;
            final ValueChanged<_DrawerSection> onChanged;

            @override
            Widget build(BuildContext context) {
              final colorScheme = Theme.of(context).colorScheme;

              Widget segment(String label, _DrawerSection value) {
                final selected = section == value;
                return Expanded(
                  child: GestureDetector(
                    behavior: HitTestBehavior.opaque,
                    onTap: () => onChanged(value),
                    child: AnimatedContainer(
                      duration: const Duration(milliseconds: 220),
                      curve: Curves.easeOut,
                      padding: const EdgeInsets.symmetric(
                        horizontal: 8,
                        vertical: 7,
                      ),
                      decoration: BoxDecoration(
                        color: selected ? colorScheme.secondaryContainer : null,
                        borderRadius: BorderRadius.circular(20),
                      ),
                      child: AnimatedDefaultTextStyle(
                        duration: const Duration(milliseconds: 220),
                        curve: Curves.easeOut,
                        style: TextStyle(
                          fontSize: 14,
                          fontWeight: selected
                              ? FontWeight.w600
                              : FontWeight.w400,
                          color: selected
                              ? colorScheme.onSecondaryContainer
                              : colorScheme.onSurfaceVariant,
                        ),
                        child: Text(
                          label,
                          maxLines: 1,
                          overflow: TextOverflow.fade,
                          softWrap: false,
                          textAlign: TextAlign.center,
                        ),
                      ),
                    ),
                  ),
                );
              }

              return Container(
                padding: const EdgeInsets.all(3),
                decoration: BoxDecoration(
                  color: colorScheme.surfaceContainerHighest.withValues(
                    alpha: 0.45,
                  ),
                  borderRadius: BorderRadius.circular(23),
                ),
                child: Row(
                  children: [
                    segment(
                      S.current.category_categories,
                      _DrawerSection.categories,
                    ),
                    segment(S.current.tag_tabTags, _DrawerSection.tags),
                    segment(_drawerMoreLabel(context), _DrawerSection.more),
                  ],
                ),
              );
            }
          }'''

          text = text[:replace_start] + replacement + text[class_end:]

          if '_showTags' in text:
              raise SystemExit('legacy showTags state remains')
          for required in (
              '_DrawerSection.more',
              "'upcoming_events'",
              'NavEntryRegistry.byId',
              'class _MoreNavRow',
          ):
              if required not in text:
                  raise SystemExit(f'missing token: {required}')

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/apply-category-drawer-more.yml').unlink()
          PY

          git diff --check
          git diff -- lib/widgets/topic/category_drawer.dart

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add more section to category drawer"
          git push origin HEAD:feat/category-drawer-more
