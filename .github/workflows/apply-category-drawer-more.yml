name: Apply category drawer more navigation patch

on:
  push:
    branches: [feat/category-drawer-more]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_category_drawer.py
          python3 /tmp/patch_category_drawer.py
          git diff --check
          git diff -- lib/widgets/topic/category_drawer.dart
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add more section to category drawer"
          git push origin HEAD:feat/category-drawer-more
