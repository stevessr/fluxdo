name: Apply category drawer more navigation patch

on:
  push:
    branches:
      - feat/category-drawer-more

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/widgets/topic/category_drawer.dart')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import '../../models/tag_search_result.dart';\n",
              "import '../../models/tag_search_result.dart';\n"
              "import '../../navigation/nav_entry.dart';\n"
              "import '../../navigation/nav_entry_registry.dart';\n",
              'navigation imports',
          )

          replace_once(
              'class CategoryDrawer extends ConsumerStatefulWidget {',
              "enum _DrawerSection { categories, tags, more }\n\n"
              "String _drawerMoreLabel(BuildContext context) =>\n"
              "    Localizations.localeOf(context).languageCode == 'zh' ? '更多' : 'More';\n\n"
              'class CategoryDrawer extends ConsumerStatefulWidget {',
              'drawer section enum',
          )

          replace_once(
              "  /// 当前页签：false = 分类，true = 标签\n"
              "  bool _showTags = false;\n",
              "  /// 当前页签：分类 / 标签 / 更多\n"
              "  _DrawerSection _section = _DrawerSection.categories;\n\n"
              "  static const List<String> _moreEntryIds = [\n"
              "    'chat',\n"
              "    'messages',\n"
              "    'ai_bot',\n"
              "    'leaderboard',\n"
              "    'groups',\n"
              "    'upcoming_events',\n"
              "  ];\n",
              'drawer state',
          )

          old_header = '''            // —— 头部：分类 ⇄ 标签 页签切换（编辑铅笔只属于分类页）——
            Padding(
              padding: const EdgeInsets.fromLTRB(16, 10, 8, 6),
              child: Row(
                children: [
                  _DrawerTabSwitcher(
                    showTags: _showTags,
                    onChanged: (v) => setState(() => _showTags = v),
                  ),
                  const Spacer(),
                  if (!_showTags && pinnedIds.isNotEmpty)
                    IconButton(
                      icon: const Icon(Symbols.edit_rounded, size: 20),
                      tooltip: S.current.common_edit,
                      visualDensity: VisualDensity.compact,
                      onPressed: () =>
                          _closeAndPush(const PinnedCategoryEditPage()),
                    ),
                ],
              ),
            ),
            Expanded(
              child: _showTags
                  ? _buildTagsList()
                  : _buildCategoriesList(categoriesAsync, pinnedIds, levelFor),
            ),'''

          new_header = '''            // —— 头部：分类 / 标签 / 更多（编辑铅笔只属于分类页）——
            Padding(
              padding: const EdgeInsets.fromLTRB(16, 10, 8, 6),
              child: Row(
                children: [
                  Expanded(
                    child: _DrawerTabSwitcher(
                      section: _section,
                      onChanged: (section) =>
                          setState(() => _section = section),
                    ),
                  ),
                  if (_section == _DrawerSection.categories &&
                      pinnedIds.isNotEmpty) ...[
                    const SizedBox(width: 4),
                    IconButton(
                      icon: const Icon(Symbols.edit_rounded, size: 20),
                      tooltip: S.current.common_edit,
                      visualDensity: VisualDensity.compact,
                      onPressed: () =>
                          _closeAndPush(const PinnedCategoryEditPage()),
                    ),
                  ],
                ],
              ),
            ),
            Expanded(
              child: switch (_section) {
                _DrawerSection.categories => _buildCategoriesList(
                  categoriesAsync,
                  pinnedIds,
                  levelFor,
                ),
                _DrawerSection.tags => _buildTagsList(),
                _DrawerSection.more => _buildMoreList(isLoggedIn),
              },
            ),'''
          replace_once(old_header, new_header, 'drawer header')

          marker = '''  /// 分类页签：收藏区 + 全部分类父子树（原侧栏主体）
  Widget _buildCategoriesList('''
          more_method = '''  /// 更多：复用统一导航注册表，避免在抽屉里复制页面与文案定义。
  Widget _buildMoreList(bool isLoggedIn) {
    final entries = _moreEntryIds
        .map(NavEntryRegistry.byId)
        .whereType<NavEntry>()
        .where((entry) => !entry.requiresLogin || isLoggedIn)
        .toList(growable: false);

    return ListView(
      padding: const EdgeInsets.fromLTRB(12, 4, 12, 24),
      children: [
        for (final entry in entries)
          _MoreNavRow(
            icon: entry.iconData,
            label: entry.label(context),
            onTap: () {
              final pageBuilder = entry.pageBuilder;
              if (pageBuilder == null) return;
              _closeAndPush(pageBuilder(context, true));
            },
          ),
      ],
    );
  }

  /// 分类页签：收藏区 + 全部分类父子树（原侧栏主体）
  Widget _buildCategoriesList('''
          replace_once(marker, more_method, 'more list')

          old_switcher = '''/// 抽屉头部的「分类 ⇄ 标签」分段切换（M3 connected button group 简
/// 化版：胶囊底 + 滑动选中块）
class _DrawerTabSwitcher extends StatelessWidget {
  const _DrawerTabSwitcher({required this.showTags, required this.onChanged});

  final bool showTags;
  final ValueChanged<bool> onChanged;

  @override
  Widget build(BuildContext context) {
    final colorScheme = Theme.of(context).colorScheme;

    Widget segment(String label, bool selected, VoidCallback onTap) {
      return GestureDetector(
        behavior: HitTestBehavior.opaque,
        onTap: onTap,
        child: AnimatedContainer(
          duration: const Duration(milliseconds: 220),
          curve: Curves.easeOut,
          padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 7),
          decoration: BoxDecoration(
            color: selected ? colorScheme.secondaryContainer : null,
            borderRadius: BorderRadius.circular(20),
          ),
          child: AnimatedDefaultTextStyle(
            duration: const Duration(milliseconds: 220),
            curve: Curves.easeOut,
            style: TextStyle(
              fontSize: 14,
              fontWeight: selected ? FontWeight.w600 : FontWeight.w400,
              color: selected
                  ? colorScheme.onSecondaryContainer
                  : colorScheme.onSurfaceVariant,
            ),
            child: Text(label),
          ),
        ),
      );
    }

    return Container(
      padding: const EdgeInsets.all(3),
      decoration: BoxDecoration(
        color: colorScheme.surfaceContainerHighest.withValues(alpha: 0.45),
        borderRadius: BorderRadius.circular(23),
      ),
      child: Row(
        mainAxisSize: MainAxisSize.min,
        children: [
          segment(
            S.current.category_categories,
            !showTags,
            () => onChanged(false),
          ),
          segment(S.current.tag_tabTags, showTags, () => onChanged(true)),
        ],
      ),
    );
  }
}
'''

          new_switcher = '''/// 抽屉头部的「分类 / 标签 / 更多」分段切换。
class _DrawerTabSwitcher extends StatelessWidget {
  const _DrawerTabSwitcher({required this.section, required this.onChanged});

  final _DrawerSection section;
  final ValueChanged<_DrawerSection> onChanged;

  @override
  Widget build(BuildContext context) {
    final colorScheme = Theme.of(context).colorScheme;

    Widget segment(String label, _DrawerSection value) {
      final selected = section == value;
      return Expanded(
        child: GestureDetector(
          behavior: HitTestBehavior.opaque,
          onTap: () => onChanged(value),
          child: AnimatedContainer(
            duration: const Duration(milliseconds: 220),
            curve: Curves.easeOut,
            padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 7),
            decoration: BoxDecoration(
              color: selected ? colorScheme.secondaryContainer : null,
              borderRadius: BorderRadius.circular(20),
            ),
            child: AnimatedDefaultTextStyle(
              duration: const Duration(milliseconds: 220),
              curve: Curves.easeOut,
              style: TextStyle(
                fontSize: 14,
                fontWeight: selected ? FontWeight.w600 : FontWeight.w400,
                color: selected
                    ? colorScheme.onSecondaryContainer
                    : colorScheme.onSurfaceVariant,
              ),
              child: Text(
                label,
                maxLines: 1,
                overflow: TextOverflow.fade,
                softWrap: false,
                textAlign: TextAlign.center,
              ),
            ),
          ),
        ),
      );
    }

    return Container(
      padding: const EdgeInsets.all(3),
      decoration: BoxDecoration(
        color: colorScheme.surfaceContainerHighest.withValues(alpha: 0.45),
        borderRadius: BorderRadius.circular(23),
      ),
      child: Row(
        children: [
          segment(S.current.category_categories, _DrawerSection.categories),
          segment(S.current.tag_tabTags, _DrawerSection.tags),
          segment(_drawerMoreLabel(context), _DrawerSection.more),
        ],
      ),
    );
  }
}
'''
          replace_once(old_switcher, new_switcher, 'tab switcher')

          more_row = '''class _MoreNavRow extends StatelessWidget {
  const _MoreNavRow({
    required this.icon,
    required this.label,
    required this.onTap,
  });

  final IconData icon;
  final String label;
  final VoidCallback onTap;

  @override
  Widget build(BuildContext context) {
    final colorScheme = Theme.of(context).colorScheme;
    return Padding(
      padding: const EdgeInsets.only(bottom: 2),
      child: Material(
        color: Colors.transparent,
        borderRadius: BorderRadius.circular(14),
        clipBehavior: Clip.antiAlias,
        child: InkWell(
          onTap: onTap,
          child: Padding(
            padding: const EdgeInsets.symmetric(horizontal: 10),
            child: SizedBox(
              height: 48,
              child: Row(
                children: [
                  Container(
                    width: 32,
                    height: 32,
                    decoration: BoxDecoration(
                      color: colorScheme.primaryContainer.withValues(alpha: 0.65),
                      borderRadius: BorderRadius.circular(9),
                    ),
                    child: Icon(
                      icon,
                      size: 18,
                      color: colorScheme.onPrimaryContainer,
                    ),
                  ),
                  const SizedBox(width: 12),
                  Expanded(
                    child: Text(
                      label,
                      maxLines: 1,
                      overflow: TextOverflow.ellipsis,
                      style: TextStyle(
                        fontSize: 14.5,
                        color: colorScheme.onSurface,
                      ),
                    ),
                  ),
                  const SizedBox(width: 8),
                  Icon(
                    Symbols.chevron_right_rounded,
                    size: 20,
                    color: colorScheme.onSurfaceVariant,
                  ),
                ],
              ),
            ),
          ),
        ),
      ),
    );
  }
}

'''
          replace_once(
              '/// 抽屉头部的「分类 / 标签 / 更多」分段切换。\n',
              more_row + '/// 抽屉头部的「分类 / 标签 / 更多」分段切换。\n',
              'more row',
          )

          if '_showTags' in text:
              raise SystemExit('legacy _showTags state still present')
          for required in (
              '_DrawerSection.more',
              "'upcoming_events'",
              'NavEntryRegistry.byId',
              'class _MoreNavRow',
          ):
              if required not in text:
                  raise SystemExit(f'missing expected token: {required}')

          path.write_text(text)
          Path('.github/workflows/apply-category-drawer-more.yml').unlink()
          PY

          git diff --check
          git diff -- lib/widgets/topic/category_drawer.dart

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add more section to category drawer"
          git push origin HEAD:feat/category-drawer-more
