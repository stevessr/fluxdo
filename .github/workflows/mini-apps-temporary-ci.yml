name: Mini Apps Temporary Validation
on:
  push:
    branches:
      - feat/discourse-mini-apps-20261102
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mini-apps-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-mini-apps:
    name: Validate mini app implementation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Prepare generated test dependencies
        run: dart run tool/project_prep.dart test

      - name: Check Dart format of feature files
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/models/mini_app.dart \
            lib/pages/mini_apps_page.dart \
            lib/utils/discourse_url_parser.dart \
            lib/utils/link_launcher.dart \
            lib/services/deep_link_service.dart \
            lib/navigation/nav_entry_registry.dart \
            test/models/mini_app_test.dart \
            test/utils/discourse_url_parser_mini_apps_test.dart

      - name: Static analysis of feature files
        run: |
          flutter analyze --no-pub \
            lib/models/mini_app.dart \
            lib/pages/mini_apps_page.dart \
            lib/utils/discourse_url_parser.dart \
            lib/utils/link_launcher.dart \
            lib/services/deep_link_service.dart \
            lib/navigation/nav_entry_registry.dart \
            test/models/mini_app_test.dart \
            test/utils/discourse_url_parser_mini_apps_test.dart

      - name: Mini-app tests
        run: flutter test --no-pub test/models/mini_app_test.dart test/utils/discourse_url_parser_mini_apps_test.dart
