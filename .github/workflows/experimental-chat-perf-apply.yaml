name: Apply experimental chat performance wave

on:
  push:
    branches:
      - feat/experimental-matrix-telegram
    paths:
      - '.github/workflows/experimental-chat-perf-apply.yaml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/experimental-matrix-telegram
          fetch-depth: 0

      - name: Apply Thread route polling guard
        run: python3 tool/experimental_matrix_thread_route_guard.py

      - name: Validate patch
        run: |
          git diff --check
          git diff -- lib/pages/chat/matrix_room_page.dart

      - name: Commit Thread route polling guard
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/chat/matrix_room_page.dart
          git commit -m 'perf(matrix): keep room polling paused behind threads'
          git push origin HEAD:feat/experimental-matrix-telegram
