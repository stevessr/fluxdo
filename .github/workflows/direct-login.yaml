name: Direct Login

on:
  pull_request:
    paths:
      - 'lib/pages/login_page.dart'
      - 'lib/pages/webview_login_page.dart'
      - 'lib/services/login_token_redeemer.dart'
      - 'lib/services/webview_login_session_probe.dart'
      - 'lib/services/network/cookie/app_cookie_manager.dart'
      - 'test/services/login_token_redeemer_test.dart'
      - 'test/services/webview_login_session_probe_test.dart'
      - 'test/services/network/cookie/app_cookie_manager_test.dart'
      - 'lib/services/account_manager.dart'
      - 'lib/services/credential_store_service.dart'
      - 'lib/services/discourse/_login.dart'
      - 'lib/widgets/auth/login_form.dart'
      - 'lib/widgets/auth/two_factor_dialog.dart'
      - 'lib/widgets/auth/webview_login_dialog.dart'
      - 'test/services/credential_store_service_test.dart'
      - 'test/services/account_guest_startup_recovery_test.dart'
      - 'test/services/account_cold_start_snapshot_test.dart'
      - 'test/widgets/auth/direct_login_contract_test.dart'
      - '.github/workflows/direct-login.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Prepare generated asset directories
        run: mkdir -p assets/certs assets/images/llm

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: dart run tool/gen_l10n.dart

      - name: Check formatting
        run: |
          dart format \
            lib/pages/login_page.dart \
            lib/pages/webview_login_page.dart \
            lib/services/login_token_redeemer.dart \
            lib/services/webview_login_session_probe.dart \
            lib/services/network/cookie/app_cookie_manager.dart \
            test/services/login_token_redeemer_test.dart \
            test/services/webview_login_session_probe_test.dart \
            test/services/network/cookie/app_cookie_manager_test.dart \
            lib/services/account_manager.dart \
            lib/services/credential_store_service.dart \
            lib/services/discourse/_login.dart \
            lib/widgets/auth/login_form.dart \
            lib/widgets/auth/two_factor_dialog.dart \
            lib/widgets/auth/webview_login_dialog.dart \
            test/services/credential_store_service_test.dart \
            test/services/account_guest_startup_recovery_test.dart \
            test/services/account_cold_start_snapshot_test.dart \
            test/widgets/auth/direct_login_contract_test.dart
          test/services/login_token_redeemer_test.dart
          test/services/webview_login_session_probe_test.dart
          test/services/network/cookie/app_cookie_manager_test.dart
          test/services/user_api_key_login_flow_test.dart
          test/services/login_cf_challenge_classification_test.dart
          git diff --exit-code -- \
            lib/pages/login_page.dart \
            lib/pages/webview_login_page.dart \
            lib/services/login_token_redeemer.dart \
            lib/services/webview_login_session_probe.dart \
            lib/services/network/cookie/app_cookie_manager.dart \
            test/services/login_token_redeemer_test.dart \
            test/services/webview_login_session_probe_test.dart \
            test/services/network/cookie/app_cookie_manager_test.dart \
            lib/services/account_manager.dart \
            lib/services/credential_store_service.dart \
            lib/services/discourse/_login.dart \
            lib/widgets/auth/login_form.dart \
            lib/widgets/auth/two_factor_dialog.dart \
            lib/widgets/auth/webview_login_dialog.dart \
            test/services/credential_store_service_test.dart \
            test/services/account_guest_startup_recovery_test.dart \
            test/services/account_cold_start_snapshot_test.dart \
            test/widgets/auth/direct_login_contract_test.dart

      - name: Analyze direct login changes
        run: >-
          flutter analyze
          lib/pages/login_page.dart
          lib/pages/webview_login_page.dart
          lib/services/login_token_redeemer.dart
          lib/services/webview_login_session_probe.dart
          lib/services/network/cookie/app_cookie_manager.dart
          test/services/login_token_redeemer_test.dart
          test/services/webview_login_session_probe_test.dart
          test/services/network/cookie/app_cookie_manager_test.dart
          lib/services/account_manager.dart
          lib/services/credential_store_service.dart
          lib/services/discourse/discourse_service.dart
          lib/widgets/auth/login_form.dart
          lib/widgets/auth/two_factor_dialog.dart
          lib/widgets/auth/webview_login_dialog.dart
          test/services/credential_store_service_test.dart
          test/services/account_guest_startup_recovery_test.dart
          test/services/account_cold_start_snapshot_test.dart
          test/widgets/auth/direct_login_contract_test.dart

      - name: Test direct login and credential storage
        run: >-
          dart tool/flutterw.dart test
          test/services/credential_store_service_test.dart
          test/services/account_guest_startup_recovery_test.dart
          test/services/account_cold_start_snapshot_test.dart
          test/widgets/auth/direct_login_contract_test.dart
