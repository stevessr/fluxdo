name: Direct Login

on:
  pull_request:
    paths:
      - 'lib/pages/login_page.dart'
      - 'lib/services/discourse/_login.dart'
      - 'lib/widgets/auth/two_factor_dialog.dart'
      - 'lib/widgets/auth/webview_login_dialog.dart'
      - 'test/widgets/auth/direct_login_contract_test.dart'
      - '.github/workflows/direct-login.yaml'
  push:
    branches:
      - main
    paths:
      - 'lib/pages/login_page.dart'
      - 'lib/services/discourse/_login.dart'
      - 'lib/widgets/auth/two_factor_dialog.dart'
      - 'lib/widgets/auth/webview_login_dialog.dart'
      - 'test/widgets/auth/direct_login_contract_test.dart'
      - '.github/workflows/direct-login.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Prepare generated asset directories
        run: mkdir -p assets/certs assets/images/llm

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: dart run tool/gen_l10n.dart

      - name: Check formatting
        run: |
          dart format             lib/pages/login_page.dart             lib/services/discourse/_login.dart             lib/widgets/auth/two_factor_dialog.dart             lib/widgets/auth/webview_login_dialog.dart             test/widgets/auth/direct_login_contract_test.dart
          git diff --exit-code --             lib/pages/login_page.dart             lib/services/discourse/_login.dart             lib/widgets/auth/two_factor_dialog.dart             lib/widgets/auth/webview_login_dialog.dart             test/widgets/auth/direct_login_contract_test.dart

      - name: Analyze direct login changes
        run: >-
          flutter analyze
          lib/pages/login_page.dart
          lib/services/discourse/discourse_service.dart
          lib/widgets/auth/two_factor_dialog.dart
          lib/widgets/auth/webview_login_dialog.dart
          test/widgets/auth/direct_login_contract_test.dart

      - name: Test direct login contracts
        run: >-
          dart tool/flutterw.dart test
          test/widgets/auth/direct_login_contract_test.dart
