name: WebView Cookie Manager

on:
  pull_request:
    paths:
      - 'lib/pages/webview_page.dart'
      - 'lib/pages/webview_cookie_manager_page.dart'
      - 'lib/services/network/cookie/site_cookie_cleanup_service.dart'
      - 'lib/services/network/cookie/site_cookie_manager_service.dart'
      - 'lib/services/network/cookie/raw_cookie_writer.dart'
      - 'packages/enhanced_cookie_jar/lib/src/enhanced_persist_cookie_jar.dart'
      - 'packages/enhanced_cookie_jar/test/delete_cookie_identity_test.dart'
      - 'test/services/site_cookie_manager_service_test.dart'
      - '.github/workflows/webview-cookie-manager.yaml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
      - 'packages/common_ui/**'
      - 'tool/gen_l10n.dart'
      - 'tool/flutterw.dart'
      - 'tool/project_prep.dart'
      - 'lib/l10n/**'
      - '.github/workflows/_check-scope.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scope:
    uses: ./.github/workflows/_check-scope.yml
    with:
      workflow_file: .github/workflows/webview-cookie-manager.yaml
      patterns: >-
        ["lib/pages/webview_page.dart","lib/pages/webview_cookie_manager_page.dart","lib/services/network/cookie/site_cookie_cleanup_service.dart","lib/services/network/cookie/site_cookie_manager_service.dart","lib/services/network/cookie/raw_cookie_writer.dart","packages/enhanced_cookie_jar/lib/src/enhanced_persist_cookie_jar.dart","packages/enhanced_cookie_jar/test/delete_cookie_identity_test.dart","test/services/site_cookie_manager_service_test.dart",".github/workflows/webview-cookie-manager.yaml","pubspec.yaml","pubspec.lock",".fvmrc","packages/common_ui/**","tool/gen_l10n.dart","tool/flutterw.dart","tool/project_prep.dart","lib/l10n/**",".github/workflows/_check-scope.yml"]

  verify:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - name: Install Flutter Linux native hook dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Prepare generated asset directories
        run: mkdir -p assets/certs

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format \
            lib/pages/webview_cookie_manager_page.dart \
            lib/services/network/cookie/site_cookie_manager_service.dart \
            packages/enhanced_cookie_jar/lib/src/enhanced_persist_cookie_jar.dart \
            packages/enhanced_cookie_jar/test/delete_cookie_identity_test.dart \
            test/services/site_cookie_manager_service_test.dart
          git diff --exit-code -- \
            lib/pages/webview_cookie_manager_page.dart \
            lib/services/network/cookie/site_cookie_manager_service.dart \
            packages/enhanced_cookie_jar/lib/src/enhanced_persist_cookie_jar.dart \
            packages/enhanced_cookie_jar/test/delete_cookie_identity_test.dart \
            test/services/site_cookie_manager_service_test.dart

      - name: Analyze cookie manager
        run: >-
          flutter analyze
          lib/pages/webview_page.dart
          lib/pages/webview_cookie_manager_page.dart
          lib/services/network/cookie/site_cookie_manager_service.dart
          packages/enhanced_cookie_jar/lib/src/enhanced_persist_cookie_jar.dart
          test/services/site_cookie_manager_service_test.dart

      - name: Test app cookie manager contracts
        run: >-
          dart tool/flutterw.dart test
          test/services/site_cookie_manager_service_test.dart

      - name: Test enhanced cookie jar identity deletion
        working-directory: packages/enhanced_cookie_jar
        run: dart test test/delete_cookie_identity_test.dart
