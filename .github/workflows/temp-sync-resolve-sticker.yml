name: Temporary upstream sticker conflict resolver

on:
  push:
    branches:
      - sync/upstream-20260905

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Resolve sticker overlap without replacing fork cache logic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Lingyan000/fluxdo.git || true
          git fetch upstream main
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def upstream(path):
              return subprocess.check_output(['git','show',f'upstream/main:{path}'], text=True)

          def class_block(text, marker):
              start = text.index(marker)
              brace = text.index('{', start)
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == '{': depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
              raise RuntimeError(marker)

          # 1) 模型：去除 hunk 回放产生的重复类型；保留 fork 结构，补齐元信息序列化/更新。
          path = 'lib/models/sticker.dart'
          p = Path(path); text = p.read_text()
          marker = 'class StickerMarketTopic {'
          starts = []
          pos = 0
          while True:
              i = text.find(marker, pos)
              if i < 0: break
              starts.append(i); pos = i + 1
          if len(starts) > 1:
              s, e = class_block(text[starts[1]:], marker)
              s += starts[1]; e += starts[1]
              while e < len(text) and text[e] == '\n': e += 1
              text = text[:starts[1]] + text[e:]
          if 'Map<String, dynamic> toJson() =>' not in text[text.index('class StickerGroup {'):text.index('class StickerItem {')]:
              group_start = text.index('class StickerGroup {')
              group_end = text.index('class StickerItem {')
              group = text[group_start:group_end]
              insert = '''\n  /// 与 [fromJson] 对称，用于持久化已订阅分组元信息。\n  Map<String, dynamic> toJson() => {\n    'id': id,\n    'name': name,\n    'icon': icon,\n    'order': order,\n    'emojiCount': emojiCount,\n    'isArchived': isArchived,\n    'topic': topic,\n  };\n\n  StickerGroup copyWith({String? name, String? icon, int? emojiCount}) {\n    return StickerGroup(\n      id: id,\n      name: name ?? this.name,\n      icon: icon ?? this.icon,\n      order: order,\n      emojiCount: emojiCount ?? this.emojiCount,\n      isArchived: isArchived,\n      topic: topic,\n    );\n  }\n'''
              close = group.rfind('}')
              group = group[:close] + insert + group[close:]
              text = text[:group_start] + group + text[group_end:]
          p.write_text(text)

          # 2) Provider：市场分页并发控制直接采用上游的双世代实现；
          # 只替换 MarketGroupsNotifier，不碰 fork 的缩略图预取、订阅 provider 等其它逻辑。
          path = 'lib/providers/sticker_provider.dart'
          p = Path(path); text = p.read_text(); up = upstream(path)
          marker = 'class MarketGroupsNotifier'
          s, e = class_block(text, marker)
          us, ue = class_block(up, marker)
          text = text[:s] + up[us:ue] + text[e:]
          p.write_text(text)

          # 3) Service：保留 fork 的旧 getIndex/getAllGroups 兼容接口，补齐上游订阅元数据语义。
          path = 'lib/services/sticker_market_service.dart'
          p = Path(path); text = p.read_text()
          start = text.index('  /// 获取已订阅的分组 ID 列表')
          end = text.index('  /// 是否已订阅', start)
          replacement = '''  /// 获取已订阅的分组 ID 列表（订阅顺序即展示顺序）\n  List<String> getSubscribedGroupIds() {\n    return _prefs.getStringList(_subscribedKey) ?? [];\n  }\n\n  /// 已订阅分组（含 tab 首帧所需的 name/icon），按订阅顺序返回。\n  List<StickerGroup> getSubscribedGroups() {\n    final metaById = _readSubscribedMeta();\n    return [\n      for (final id in getSubscribedGroupIds())\n        metaById[id] ??\n            StickerGroup(\n              id: id,\n              name: '',\n              icon: '',\n              order: 0,\n              emojiCount: 0,\n              isArchived: false,\n            ),\n    ];\n  }\n\n  /// 兼容旧调用（String id）和上游新调用（StickerGroup）；新调用会同步缓存元信息。\n  Future<void> subscribe(Object groupOrId) async {\n    final group = groupOrId is StickerGroup ? groupOrId : null;\n    final groupId = group?.id ?? groupOrId.toString();\n    final ids = getSubscribedGroupIds();\n    if (!ids.contains(groupId)) {\n      ids.add(groupId);\n      await _prefs.setStringList(_subscribedKey, ids);\n    }\n    if (group != null) await cacheSubscribedGroupMeta(group);\n  }\n\n  /// 取消订阅，连带清掉元信息缓存。\n  Future<void> unsubscribe(String groupId) async {\n    final ids = getSubscribedGroupIds();\n    ids.remove(groupId);\n    await _prefs.setStringList(_subscribedKey, ids);\n    final metaById = _readSubscribedMeta();\n    if (metaById.remove(groupId) != null) {\n      await _writeSubscribedMeta(metaById);\n    }\n  }\n\n'''
          text = text[:start] + replacement + text[end:]
          p.write_text(text)

          # 4) Market Sheet：调用端已经是 showDraggable；把 Sheet 也切到同一协议。
          # 只改外壳/scrollController 所有权，不替换 fork 的图片缓存/Tile 实现。
          path = 'lib/widgets/markdown_editor/sticker_market_sheet.dart'
          p = Path(path); text = p.read_text()
          text = text.replace(
              'class StickerMarketSheet extends ConsumerStatefulWidget {\n  const StickerMarketSheet({super.key});',
              'class StickerMarketSheet extends ConsumerStatefulWidget {\n  final ScrollController scrollController;\n\n  const StickerMarketSheet({super.key, required this.scrollController});', 1)
          text = text.replace('  final ScrollController _scrollController = ScrollController();\n', '')
          if 'ScrollController get _scrollController => widget.scrollController;' not in text:
              needle = "  String _selectedTopic = 'all';\n"
              text = text.replace(needle, needle + '\n  ScrollController get _scrollController => widget.scrollController;\n', 1)
          text = text.replace(
              '    _searchController.dispose();\n    _scrollController.dispose();\n',
              '    _searchController.dispose();\n    _scrollController.removeListener(_onScroll);\n', 1)
          build_start = text.index('  @override\n  Widget build(BuildContext context) {')
          search_marker = text.index('  // ==================== 搜索与分类 ====================', build_start)
          old_build = text[build_start:search_marker]
          new_build = '''  @override\n  Widget build(BuildContext context) {\n    final groupsAsync = ref.watch(marketGroupsProvider);\n    final topicsAsync = ref.watch(marketTopicsProvider);\n\n    return Column(\n      children: [\n        _buildSearchField(),\n        _buildTopicChips(topicsAsync),\n        Expanded(\n          child: (() {\n            final groups = groupsAsync.value;\n            if (groups != null) return _buildGroupList(groups);\n            return groupsAsync.when(\n              data: (groups) => _buildGroupList(groups),\n              loading: () => const Center(child: LoadingSpinner()),\n              error: _buildError,\n            );\n          })(),\n        ),\n      ],\n    );\n  }\n\n'''
          text = text[:build_start] + new_build + text[search_marker:]
          p.write_text(text)
          PY
          rm -f .github/workflows/temp-sync-resolve-sticker.yml
          git add -A
          git commit -m "sync: reconcile upstream sticker market changes"
          git push origin HEAD:sync/upstream-20260905
