name: Apply preload upstream wait fastpath

on:
  push:
    branches:
      - perf/preload-upstream-wait-fastpath

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply refactor
        run: python3 .github/scripts/apply_preload_upstream_wait.py

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-preload-upstream-wait.yaml
          rm -f .github/scripts/apply_preload_upstream_wait.py
          git diff --check
          grep -q 'bool _loading = false;' lib/services/preloaded_data_service.dart
          ! grep -q 'PreloadProgress' lib/services/preloaded_data_service.dart
          ! grep -q 'preloadProgressListenable' lib/pages/topics_screen.dart
          ! grep -q 'progressiveTopicListListenable' lib/providers/topic_list/topic_list_provider.dart
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(preload): restore upstream wait and remove progress UI'
          git push origin HEAD:perf/preload-upstream-wait-fastpath
